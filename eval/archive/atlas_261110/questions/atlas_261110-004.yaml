id: atlas_261110-004
user_story: 6
question: |
  Which projects in ELIXIR's 2024–28 Scientific Programme involve the Systems
  Biology Community, and where does its work connect to the ELIXIR Platforms?
answerability: answerable
reference_answer: |
  The Systems Biology Community takes part in 3 of the 7 Cellular and
  molecular research projects of the 2024–28 Scientific Programme:

  - **DBTLHub** (2024–2026): a one-stop shop of databases, datasets and tools
    for the Design-Build-Test-Learn cycle in biotechnology.
  - **RCI-M** (2024–2026): reproducible, comparable and integrable
    metabolomics, including integration with multi-omics and systems biology
    studies.
  - **TELLME** (2026): an AI service that uses large language models to
    explain systems biology and multi-omics models.

  The Programme document does not name the Community. Its Ambition 1.1 plans
  FAIR models from machine learning and systems biology, with "FAIR
  collections of machine learning and systems biology models" as a desired
  outcome.

  **Connections to the Platforms**
  - **Tools and Training:** TELLME is to be registered in bio.tools and have
    tutorials listed in TeSS.
  - **Interoperability:** the Platform's 2024–26 work plan names ODE-based
    kinetic models "as used in toxicology and systems biology communities" as
    a candidate use case.
  - **Data:** RCI-M links metabolomics to the ELIXIR Deposition Databases and
    the ISA framework.

  Sources:
  - Cellular and molecular research projects:
    https://elixir-europe.org/internal-projects/commissioned-services/science/cellular-molecular-research
  - DBTLHub:
    https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub
  - RCI-M:
    https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/metabolomics
  - TELLME:
    https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/tellme
  - Programme 2024–28, Ambition 1.1:
    https://elixir-europe.org/sites/default/files/documents/elixir-programme-24-28-full.pdf
  - Interoperability Platform 2024–26:
    https://elixir-europe.org/internal-projects/commissioned-services/2024-interoperability
eval_notes: |
  Scored:
  1. Projects: DBTLHub, RCI-M and TELLME, and no other 2024–28 project.
  2. Aims: each project's aim, roughly.
  3. Programme: Ambition 1.1 plans FAIR machine learning and systems biology
     models.
  4. Tools and Training: TELLME's planned bio.tools registration and TeSS
     tutorials. Galaxy and AAI compatibility are also accepted.
  5. Interoperability: the 2024–26 work plan names kinetic models used by the
     toxicology and systems biology communities as a candidate use case.
  Accepted: saying the Programme document does not name the Community. SYBEL
  (2023–2024) and the EKES staff exchange as earlier activities, if not
  presented as 2024–28 projects.
