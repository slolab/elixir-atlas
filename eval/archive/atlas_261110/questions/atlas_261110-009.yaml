id: atlas_261110-009
user_story: 8
question: |
  I maintain the ELIXIR-STEERS deliverables page on the ELIXIR website. Which
  deliverables have become public that the page does not yet link or list,
  with their dates and links? Is the page's list of deliverables still
  complete, and which deliverables are due but not yet public?
answerability: answerable
reference_answer: |
  Page: https://elixir-europe.org/about-us/how-funded/eu-projects/steers/deliverables
  (last edited 3 August 2026). It lists 17 deliverables and links 9.

  **Public but missing from the page**

  | Deliverable | Public since | Link |
  |---|---|---|
  | D1.6 Updated Project Handbook v3 (listed, not linked) | 3 Feb 2026 | https://zenodo.org/records/18469231 |
  | D1.9 Policy briefing on credit and recognition of research artefacts | 8 Sep 2025 | https://zenodo.org/records/17076988 |
  | Policy brief "Better software, better research", probably D1.10 | 24 Sep 2026 | https://zenodo.org/records/22938411 |

  **The list is incomplete.** The handbook v3 lists 22 deliverables: the
  page's 17, D1.9, D1.10 and three sensitive ethics deliverables (D6.1–D6.3),
  which should not be linked. The main STEERS page still says "There are 17
  deliverables" (https://elixir-europe.org/about-us/how-funded/eu-projects/steers).

  **Due but not public**
  - D1.7 Long-Term Sustainability Plan, due January 2026: not on Zenodo or
    CORDIS. Check its status.
  - D1.8 Updated Data Management Plan v3, due November 2026.
  - D2.2, D3.2, D4.2, D4.3 and D5.2, due January 2027 at the project's end.

  Zenodo (https://zenodo.org/communities/elixir-steers) is the most current
  source. CORDIS (https://cordis.europa.eu/project/id/101131096/results,
  updated 6 November 2026) lists only 9 deliverables.
eval_notes: |
  Scored:
  1. D1.6 has been public on Zenodo since February 2026 but is not linked.
  2. D1.9, the policy briefing on credit and recognition (September 2025), is
     missing.
  3. The policy brief "Better software, better research" (September 2026) is
     missing. Calling it D1.10 is accepted, not required.
  4. The list is incomplete: it omits at least D1.9 and D1.10.
  5. D1.7, due January 2026, is not public and needs checking.
  6. D1.8 (November 2026) and D2.2, D3.2, D4.2, D4.3 and D5.2 (January 2027)
     are not public yet and not overdue.
  Accepted: DOIs (10.5281/zenodo.<record>) for Zenodo URLs; either Zenodo
  version of D2.1 (16962446, 17035105).
  Traps: D4.1 is already linked. Milestone reports are not deliverables.
  Presenting the sensitive ethics deliverables as linkable scores 0 on
  component 4.
