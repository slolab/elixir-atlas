id: atlas_261110-005
user_story: 6
question: |
  What are the ELIXIR Systems Biology Community's plans for its next roadmap,
  and what remains open from the previous one?
answerability: partially_answerable
reference_answer: |
  The Community's plans are in the report of its meeting in Ljubljana on
  10–11 September 2026, published on 15 October 2026. No finalised roadmap is
  public.

  **Open from the previous roadmap** (the white paper)
  - An RDMkit page on systems biology models, updates of SBML and SED-ML for
    the FAIR principles and AI, and wider EDAM coverage
  - More model types and microbiome modelling
  - Wider engagement with the Community's training
  - A clearer value proposition for industry

  **Directions for the next roadmap**
  - **Systems biology bundle:** documented workflows built on
    ELIXIR-registered tools, with training materials. Three pilot use cases:
    medical (Disease Maps), plant (Stress Knowledge Map) and microbial (with
    the Microbial Biotechnology Community).
  - **AI in systems biology:** separating AI as a working aid (curation,
    literature mining, model building) from AI inside models, as the basis
    for a review paper and benchmarking in OpenEBench.

  **Follow-up actions**
  - RDMkit page on systems biology models, target December 2026
  - Review paper on AI and systems biology
  - Benchmarking datasets for AI models in OpenEBench
  - Talks with the Tools Platform on the Community's bio.tools pages
  - Outreach to the Disease Maps, Food and Nutrition, Plant Sciences and
    Microbial Biotechnology communities for the bundle pilots

  **Not public:** the finalised roadmap with priorities, owners and dates. The
  meeting agenda and slides and the monthly minutes need permission.

  Sources:
  - Meeting report: https://f1000research.com/documents/15-1717
  - White paper: https://doi.org/10.12688/f1000research.126734.2
eval_notes: |
  Scored:
  1. Source: the September 2026 Ljubljana meeting or its report.
  2. Bundle: the systems biology bundle with at least two of its three pilot
     use cases.
  3. AI: the AI in systems biology direction, with the review paper or
     OpenEBench benchmarking.
  4. Follow-ups: at least three of the five actions, including the RDMkit
     page targeted for December 2026.
  5. Open items: at least two items still open from the previous roadmap.
  6. Gaps: says the finalised roadmap is not public and the minutes and
     meeting documents need permission.
  Traps: the report dates only the RDMkit page; any other action date is
  invented. The 2022 white paper is the previous roadmap, not the next one.
  "BFSP 2027–2028" in the report is a talk title, not a plan.
