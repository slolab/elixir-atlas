id: atlas_261110-001
user_story: 4
question: |
  Who holds leadership or Hub-liaison roles in more than two of ELIXIR's
  current Communities, Platforms and Focus Groups, and how much of their time
  do these roles take?
answerability: partially_answerable
reference_answer: |
  Five people hold leadership or Hub-liaison roles in more than two current
  Communities, Platforms and Focus Groups. One is Node-based; four are ELIXIR
  Hub staff, whose jobs include liaison across groups.

  - **Thanasis Vergoulis** (Athena Research Center, Greece), 3 groups: Compute
    Platform WP5 lead, Data Platform WP3 lead, and co-lead of the Credit,
    Recognition and Usage Focus Group.
  - **Katharina Heil** (Hub), 10 groups: liaison for the 3D-BioInfo,
    Intrinsically Disordered Proteins, Metabolomics, Microbial Biotechnology,
    Proteomics, Research Data Management, Single-Cell Omics and Toxicology
    Communities; Training Platform Coordinator; Communities Future Focus Group.
  - **Physilia Chua** (Hub), 7 groups: liaison for the Biodiversity, Domestic
    Animals Genome and Phenome, Food and Nutrition, Microbiome and Plant
    Sciences Communities, the Interoperability Platform and the Pathogen Data
    Focus Group.
  - **Mihail Anton** (Hub), 4 groups: liaison for the Galaxy and Systems
    Biology Communities and the Tools and Training Platforms.
  - **David Lloyd** (Hub), 4 groups: liaison for the AI Ecosystem; Credit,
    Recognition and Usage; Equity, Diversity and Inclusion; and RNA Data Focus
    Groups.

  Several people hold roles in two groups. Among them, Silvio Tosatto and Fotis
  Psomopoulos also co-lead the Science tier's Cellular and molecular research
  area.

  **Time commitment is not public.** The group pages and the Platform work
  plans give no hours or FTE per person.

  Sources:
  - Communities: https://elixir-europe.org/communities and each Community page
    linked from it
  - Platforms: https://elixir-europe.org/platforms/compute,
    https://elixir-europe.org/platforms/data,
    https://elixir-europe.org/platforms/interoperability,
    https://elixir-europe.org/platforms/tools,
    https://elixir-europe.org/platforms/training
  - Focus Groups: https://elixir-europe.org/focus-groups,
    https://elixir-europe.org/focus-groups/ai-ecosystem,
    https://elixir-europe.org/focus-groups/communities-future,
    https://elixir-europe.org/focus-groups/credit-recognition-usage,
    https://elixir-europe.org/focus-groups/equity-diversity-and-inclusion,
    https://elixir-europe.org/focus-groups/pathogen-data,
    https://elixir-europe.org/focus-groups/rna-data
  - Science tier: https://elixir-europe.org/how-we-work/scientific-programme/science
  - Platform work plans: https://doi.org/10.5281/zenodo.12819244 (Compute),
    https://doi.org/10.5281/zenodo.12807532 (Data)
eval_notes: |
  Scored:
  1. Thanasis Vergoulis: three groups, Compute Platform (WP5 lead), Data
     Platform (WP3 lead) and the Credit, Recognition and Usage Focus Group
     (co-lead).
  2. Katharina Heil and Physilia Chua: Hub staff with roles in about 10 and 7
     groups. Group lists may be incomplete but not wrong.
  3. Mihail Anton and David Lloyd: roles in more than two groups.
  4. Time: says the time these roles take is not published, without
     estimating it.
  Scope: current groups on /communities, /platforms and /focus-groups. A
  Platform lead who also leads WPs of that Platform counts once.
  Accepted: "Katharina F Heil", "Physilia Ying Shi Chua"; Hub counts off by
  one; Tosatto and Psomopoulos over the threshold if the answer names their
  Science tier role.
  Traps: past Focus Groups (Machine Learning, EOSC, Biocuration, Learning
  Paths, Environmental Impact, Professionalising Careers, Health Data,
  Registries) and the former Marine Metagenomics Community are not current.
  The old Focus Group URLs for Systems Biology, Biodiversity and Domestic
  Animals now show Communities; each counts once.
