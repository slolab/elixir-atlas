id: atlas_261110-007
user_story: 7
question: |
  I'm compiling ELIXIR Portugal's contributions to the EU project
  ELIXIR-STEERS. Who from ELIXIR Portugal works on it, and what is each person
  responsible for? How much EU funding does the Portuguese partner receive,
  and are these people funded by the project or contributing in-kind?
answerability: partially_answerable
reference_answer: |
  ELIXIR Portugal takes part in ELIXIR-STEERS (Horizon Europe grant 101131096,
  February 2024 – January 2027) through **BioData.pt**, legal name Associação
  BIP4DAB. The updated project handbook (D1.3, January 2025) names two people
  with project roles:

  - **Ana Teresa Freitas**, Head of ELIXIR Portugal: co-leader of WP4 on Node
    skills in organisation, management and training, and lead author of D4.3
    (ELITMa training materials in TeSS). She also represents BioData.pt in
    the General Assembly and the Heads of Nodes Committee.
  - **Mariana De Freitas**: leader of Task 4.2, organisational and research
    management capacity for Nodes.

  **Funding:** CORDIS lists a net EU contribution of **€114,200** to
  Associação BIP4DAB. This is the organisation's share. Public sources do not
  show whether either person is paid from it or contributes in-kind, or how
  much effort they give. BioData.pt or the STEERS project office at the
  ELIXIR Hub could confirm.

  The roles date from January 2025, and Mariana De Freitas is not on the
  current ELIXIR Portugal page, so confirm them before reporting.

  Sources:
  - CORDIS fact sheet: https://cordis.europa.eu/project/id/101131096
  - D1.3 Updated Project Handbook: https://doi.org/10.5281/zenodo.14810093
  - ELIXIR Portugal: https://biodata.pt/elixir-pt
eval_notes: |
  Scored:
  1. Partner: BioData.pt or Associação BIP4DAB.
  2. People: Ana Teresa Freitas and Mariana De Freitas, and no people from
     other projects.
  3. Ana Teresa Freitas: WP4 co-leader.
  4. Mariana De Freitas: Task 4.2 leader. WP4 deputy alone scores 0.
  5. EU funding: €114,200 net EU contribution to BIP4DAB; about €114k is
     accepted.
  6. Individual funding: says it is not public, without inferring it from the
     organisation's contribution.
  Accepted: "Ana de Freitas" and "Ana Freitas", the handbook's other spellings.
  Traps: BioData.pt's June 2026 news item names people in ELIXIR Commissioned
  Services, not STEERS: Teresa Nogueira, Ana M. Melo, Oscar Dias, Miguel
  Rocha, Jorge Oliveira and Jorge Silva. Luciana Peixoto leads an ELITMa
  module; her STEERS role is not confirmed.
