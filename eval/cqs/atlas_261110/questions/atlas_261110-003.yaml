id: atlas_261110-003
user_story: 6
question: |
  Which tools and training resources are linked to the ELIXIR Systems Biology
  Community in bio.tools and TeSS?
answerability: answerable
reference_answer: |
  The Community has a small footprint in bio.tools and a curated collection in
  TeSS.

  **bio.tools: 3 tools name the Systems Biology Community**
  - SKM (Stress Knowledge Map): knowledge map of plant stress signalling
  - GlyCombo: glycan composition from mass spectrometry data
  - GlyComboCLI: command-line version of GlyCombo

  The Community page also links three bio.tools modelling domains:
  constraint-based, logical and qualitative, and rule-based modelling.

  **TeSS: the Community's collection holds 26 events and 6 materials**

  Materials:
  - Exploring reproducible and reusable systems biology models with BioModels
  - Reproducibility in Systems Biology Modelling: BioModels' role
  - Systems biology: from large datasets to biological insight
  - WEBINAR: KBase - A knowledge base for systems biology
  - Training Workshop for Stress Knowledge Map
  - MaBoSS: a tool for modelling biological systems

  Five events start from 10 November 2026, for example Dynamic Modeling in
  Systems Biology (Wageningen, 7–11 December 2026) and Constraint-Based
  Modeling (Maastricht, 1–5 February 2027).

  Sources:
  - bio.tools: https://bio.tools/skm, https://bio.tools/glycombo,
    https://bio.tools/glycombocli
  - TeSS collection:
    https://tess.elixir-europe.org/collections/elixir-systems-biology-community-training-events-and-materials1
  - Community page (modelling domains):
    https://elixir-europe.org/communities/systems-biology
eval_notes: |
  Scored:
  1. bio.tools: exactly 3 tools carry the Community tag: SKM, GlyCombo and
     GlyComboCLI.
  2. TeSS: the Community's collection holds 26 events and 6 materials.
  3. Materials: at least four of the six, none wrong.
  4. Domains: the three bio.tools modelling domains linked from the Community
     page.
  Traps: the bio.tools collection "Plant Systems Biology" (43 tools) and the
  211 TeSS events with the EDAM topic "Systems biology" are not the Community.
  The SYBEL 2023 webinar appears twice in the collection; both count towards
  the 26.
