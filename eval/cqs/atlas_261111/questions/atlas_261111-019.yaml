id: atlas_261111-019
use_case: "C2.2"
question: |
  Who in the ELIXIR Systems Biology Community develops or looks after tools?
answerability: partially_answerable
reference_answer: |
  These are documented links between people active in the Community and
  tools:

  | Person | Tool and documented role |
  | --- | --- |
  | Carissa Bleker | Developer and maintainer of [SKM](https://bio.tools/skm) and [BoolDog](https://bio.tools/booldog) |
  | Miguel Rocha and Oscar Dias | Listed in the credits for [merlin](https://bio.tools/merlin-sysbio); Oscar is also the primary contact for [TranSyT](https://bio.tools/transyt) |
  | Mihail Anton | Primary contact for [Metabolic Atlas](https://bio.tools/metabolicatlas) |
  | Marek Ostaszewski | Primary contact for [MINERVA](https://bio.tools/MINERVA_Platform) |

  Carissa and Miguel are co-leads, and Mihail is the liaison, on the
  [Community page](https://elixir-europe.org/communities/systems-biology).
  Oscar and Marek presented at the [September 2026 Community meeting](https://f1000research.com/documents/15-1717).

  This is a public starting list. It does not establish the full membership,
  who currently has time to help, or formal responsibility for maintaining
  these tools on the Community's behalf.
eval_notes: |
  Scored:
  1. Provides concrete person–tool links supported by tool records or other
     direct evidence. Verified examples include Bleker–SKM/BoolDog,
     Rocha/Dias–merlin, Dias–TranSyT, Anton–Metabolic Atlas and
     Ostaszewski–MINERVA.
  2. Establishes a Community connection for the named people, such as a
     leadership role, Community project or documented Community activity;
     a tool's Community tag alone does not establish its developer's membership.
  3. Describes roles at the strength of the evidence: developer, maintainer,
     contributor and primary contact are not interchangeable. Untyped
     bio.tools credits establish credit, not a specific maintenance role.
  4. Gives a useful list without claiming exhaustive current membership,
     available effort or assigned Community maintenance responsibility from
     incomplete public records.
  Accepted: other well-supported people and tools, or a shorter list focused
  on direct developers/maintainers. Do not require exactly three tagged
  tools, a fixed number of pairs, method narration, or the Community's
  resource-domain links. GlyCombo and GlyComboCLI have a Systems Biology tag
  but that alone does not establish Christopher Ashwood or Maia Kelly as
  Community members. The original attribution of every credited person as
  a developer is too strong; preserve the source's role distinction.
