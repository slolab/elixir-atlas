id: atlas_261111-019
use_case: "C2.2"
question: |
  Who in the ELIXIR Systems Biology Community develops or supports tools, and
  which tools are they? Use bio.tools credits and the Community's own pages.
answerability: partially_answerable
reference_answer: |
  The Community's member list is not public, so "members" here means people
  named on public pages: the co-leads and liaison, the SYBEL participants,
  the 2026 meeting report and the authors of "Making Models That Matter".
  Tools were matched to them by the person's name in bio.tools credits.

  **Tagged with the Systems Biology Community in bio.tools** (3 tools)
  - **SKM** (Stress Knowledge Map), also tagged Plant Sciences: Carissa
    Bleker, Kristina Gruden, Živa Ramšak, Vid Podpečan, National Institute
    of Biology (ELIXIR Slovenia). https://bio.tools/skm
  - **GlyCombo** and **GlyComboCLI**: Christopher Ashwood and Maia Kelly,
    who appear nowhere else in the Community's pages.

  **Tools credited to named Community people** (no Community tag)
  - National Institute of Biology, Slovenia: BoolDog (Carissa Bleker, Anže
    Županič, Kristina Gruden); DiNAR (Kristina Gruden, Živa Ramšak).
  - University of Minho, Portugal: merlin (Miguel Rocha, Oscar Dias);
    TranSyT and diel_models (Oscar Dias).
  - ELIXIR Sweden: Metabolic Atlas (Mihail Anton).
  - Luxembourg: MINERVA Platform (Marek Ostaszewski).
  - Germany: COPASI and basico (Frank T. Bergmann).
  - Maastricht University: PathVisio (Chris Evelo, Martina Kutmon) and
    WikiPathways (Martina Kutmon).
  - EMBL-EBI: BioModels (Rahuman Malik-Sheriff).
  - Others: CaSQ and RA-map (Anna Niarakis), CyFi-MAP (Irina Balaur),
    AEON.py (David Šafránek), modelbase (Anna Matuszyńska).

  **Resources the Community page promotes**
  - standard-GEM, and three bio.tools modelling domains: constraint-based
    (22 tools), logical and qualitative (29) and rule-based modelling (6).
    Several domain tools are credited to the people above, for example
    merlin and Metabolic Atlas (constraint-based) and CaSQ and AEON.py
    (logical). Domain membership alone does not show who in the Community
    supports a tool.

  **Gaps**
  - No public member list, and no record of who maintains which tool for
    the Community. The meeting report plans talks with the Tools Platform to
    improve the Community's representation in bio.tools.
  - Name matching may miss people credited only by institution.

  Sources:
  - Community page: https://elixir-europe.org/communities/systems-biology
  - SYBEL: https://elixir-europe.org/internal-projects/commissioned-services/2023-sybel
  - Meeting report: https://f1000research.com/documents/15-1717
  - Preprint: https://arxiv.org/abs/2609.13127
  - bio.tools entries: https://bio.tools/<id>, for example
    https://bio.tools/merlin-sysbio, https://bio.tools/metabolicatlas,
    https://bio.tools/MINERVA_Platform
eval_notes: |
  Scored:
  1. Says the member list is not public and names the public sources used
     for people.
  2. bio.tools tag: exactly three tools (SKM, GlyCombo, GlyComboCLI), with
     SKM credited to the National Institute of Biology group (Bleker,
     Gruden).
  3. Credited tools: at least four correct person-tool pairs among Community
     people, for example merlin (Rocha, Dias), Metabolic Atlas (Anton),
     MINERVA (Ostaszewski), COPASI (Bergmann), BoolDog (Bleker), PathVisio
     (Evelo, Kutmon).
  4. Community page resources: standard-GEM or the three bio.tools modelling
     domains.
  5. No wrong pairing of a person with a tool.
  Accepted: other correct bio.tools credits for the named people. Grouping by
  institution or by Node. Listing domain tools as Community-promoted
  resources, if not attributed to a Community person without a credit.
  Traps: the bio.tools collection "Plant Systems Biology" is not the
  Community. GlyCombo's developers have no other link to the Community.
  John Hancock is a co-lead candidate in the 2026 election but is not listed
  as a co-lead on the Community page; he has no bio.tools credit.
