id: atlas_261111-001
use_case: A1
question: |
  Where do the ELIXIR Communities overlap?
answerability: answerable
reference_answer: |
  Several overlaps are visible in shared projects and publications:

  | Area | Communities and shared work |
  | --- | --- |
  | Metabolomics and multi-omics | **Metabolomics, Food and Nutrition, Galaxy, Proteomics, Research Data Management, Single-Cell Omics, Systems Biology and Toxicology** share [RCI-M](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/metabolomics), which connects metabolomics standards, data and workflows. |
  | Biotechnology | **Microbial Biotechnology, Biodiversity, Microbiome, Metabolomics, Research Data Management and Systems Biology** share [DBTLHub](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub), connecting data and tools for the Design-Build-Test-Learn cycle. |
  | Human data | **Cancer Data and Federated Human Data** share [FAIR-FEGA](https://elixir-europe.org/how-we-work/scientific-programme/science/hdtr/fair-fega). **Federated Human Data, Rare Diseases and Human Copy Number Variation** also collaborate on human genomic data, as described in the [Communities paper](https://f1000research.com/articles/14-884). |
  | Protein research | **3D-BioInfo, Intrinsically Disordered Proteins and Proteomics** collaborate on protein research. Examples include [disordered-protein ontologies](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/ontologies) and [PDBe-KB annotation workflows](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/pdbe). |
  | Interpreting models | **Single-Cell Omics and Systems Biology** share [TELLME](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/tellme), which develops explanations of systems biology and multi-omics models. |

  Metabolomics, Research Data Management and Systems Biology appear in both RCI-M and DBTLHub. These are documented connections; sharing a topic or project does not by itself mean the work is duplicated.
eval_notes: |
  Intent: identify useful connections between Communities. Topic, project, output or people-based interpretations are all reasonable; no ranking or exhaustive network is requested.

  Scored:
  1. Identifies a concrete, supported selection of overlapping Communities.
  2. Explains what connects them through shared topics, projects, outputs, resources or people, with enough detail to make the connection meaningful.
  3. Keeps the meaning of the evidence accurate: planned collaboration is not a delivered output; a shared topic or catalogue tag is not proof of duplicated effort.

  Accepted: any well-supported selection can replace the examples in the reference answer. Two strong connections can fully answer the question. Neither prescribed scientific domains nor every partner in a large project is required. A people-based interpretation can satisfy the same components with supported cross-Community roles. Do not demand bio.tools examples or a prescribed clustering scheme.

  Evidence notes: RCI-M lists eight Communities and DBTLHub six. The PDBe-KB page names 3D-BioInfo in its text as well as IDP and Proteomics, although its Platform/Community field lists only the latter two. Marine Metagenomics is a former Community, now Microbiome. Catalogue tags alone may be broad or outdated.
