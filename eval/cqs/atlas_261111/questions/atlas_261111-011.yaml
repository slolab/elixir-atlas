id: atlas_261111-011
use_case: "B7"
question: |
  Can you draft a page about the ELIXIR Compute Platform's current work?
answerability: answerable
reference_answer: |
  **ELIXIR Compute Platform**

  The Compute Platform helps life scientists use European computing, cloud
  and storage services. Its [2024–2026 work programme](https://doi.org/10.5281/zenodo.12819244)
  focuses on four areas:

  - Access control for research services.
  - Secure analysis of sensitive data.
  - Infrastructure that works across multiple clouds.
  - Sustainable federated analysis, including accounting and provenance.

  The programme runs from January 2024 to December 2026. Luděk Matyska,
  Harald Wagener and Juha Törnroos lead its coordination, with Jonathan
  Tedds as Hub coordinator. The [project page](https://elixir-europe.org/how-we-work/scientific-programme/technology/24-compute)
  lists the Czech, Finnish, German, Luxembourg, Dutch and Swiss Nodes.

  **Check before publishing:** the work plan includes a wider partnership,
  including Belgium, Estonia, France, Greece, Italy and the UK. The
  [older project page](https://elixir-europe.org/internal-projects/commissioned-services/2024-compute)
  also gives a conflicting January 2026 end date. Confirm the partner list
  and use the current page's December 2026 date provisionally.
eval_notes: |
  Scored:
  1. Provides usable page content describing the Compute Platform's work,
     with supported activities such as access control, sensitive-data
     analysis, multi-cloud infrastructure or federated analytics.
  2. Describes the current work programme accurately. If dates are given,
     does not use the older January 2026 end as settled fact.
  3. Any coordination or partnership information included is supported;
     roles are not invented and Compute is not called an ELIXIR Community.
  4. Does not present disputed facts as settled where they affect the draft.
     A brief work-area page can omit dates or partner lists without an audit.
  Accepted: a shorter page draft, a different selection of relevant facts,
  or a sensible provisional draft followed by an editorial question. The
  question does not prescribe a page template, every work-package lead, a
  complete partner inventory or a Communities field. Those omissions alone
  are not errors. The plan names Matyska, Wagener and Törnroos as WP1 leads;
  Jonathan Tedds is Hub coordinator. It lists UK/Manchester even though the
  current project page omits the UK. Publication is not requested.
