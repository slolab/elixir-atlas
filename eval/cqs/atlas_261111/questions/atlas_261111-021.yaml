id: atlas_261111-021
use_case: "C2.5"
question: |
  Can the Systems Biology Community actually pull off the bundle discussed at its September meeting?
answerability: partially_answerable
reference_answer: |
  It looks plausible as a small pilot, but the public record does not
  establish that the Community has the capacity to deliver the whole bundle.

  The [September meeting report](https://f1000research.com/documents/15-1717)
  proposes documented workflows and training for three cases: medical
  applications through Disease Maps, plants through the Stress Knowledge
  Map, and microbial work with Microbial Biotechnology. It does not record
  agreed pilot owners, committed effort, a delivery schedule or funding.

  There are relevant people to approach: Marek Ostaszewski is the
  [MINERVA primary contact](https://bio.tools/MINERVA_Platform), Carissa
  Bleker develops and maintains [SKM](https://bio.tools/skm), and Oscar Dias
  and Miguel Rocha are credited on [merlin](https://bio.tools/merlin-sysbio).
  Their expertise is a starting point, not evidence that they have agreed
  to take this work on.

  The [2023 Systems Biology for Rare Diseases bundle](https://zenodo.org/records/10006029)
  is a useful precedent: it documents five use cases with tools, workflows
  and tutorials, and acknowledges ELIXIR and EJP RD funding. It shows a
  reusable format, not how many people or months the new bundle will need.

  I would first agree one pilot, a lead and a realistic time commitment,
  then reuse that format and establish the remaining resources before
  promising all three pilots.
eval_notes: |
  Scored:
  1. Identifies the September proposal accurately: documented workflows
     and training across medical/Disease Maps, plant/SKM and microbial
     use cases, or a clearly stated subset proposed as a first step.
  2. Gives a reasoned, conditional feasibility assessment using relevant
     expertise, existing resources or an appropriate delivered precedent.
  3. Separates evidence of expertise from available capacity and agreed
     responsibility. Meeting attendance, old project rosters and paper
     authorship do not establish who can deliver the new work.
  4. Identifies the material information needed before committing, such as
     owners, effort, schedule or funding, without turning absent public
     evidence into proof that no funding or coordination exists.
  A practical next step can improve the answer but is not required for a
  complete, supported feasibility assessment.
  Accepted: a cautious positive or negative assessment with evidence, a
  smaller pilot, or another appropriate comparator. The 2023 rare-disease
  bundle is one possible precedent, not a required answer. Its document
  has three authors and five use cases, but authorship is not a delivery
  team or effort estimate. Its funding acknowledgement establishes
  ELIXIR/EJP RD support, not that the same resources are available now.
  Do not require a named person for every pilot, attendance counts or a
  public membership list as proof of available capacity. Disease Maps is
  an external network, and SYBEL ended before this proposal.
