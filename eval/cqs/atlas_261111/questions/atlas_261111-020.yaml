id: atlas_261111-020
use_case: "C2.3"
question: |
  Which other Communities should Systems Biology work with on its next roadmap?
answerability: answerable
reference_answer: |
  I would start with **Microbial Biotechnology, Plant Sciences, and Food
  and Nutrition**. The [September 2026 meeting report](https://f1000research.com/documents/15-1717)
  already names them for outreach around the proposed systems biology
  bundle, so there is a concrete discussion to build on.

  - [Microbial Biotechnology](https://elixir-europe.org/communities/microbial-biotechnology):
    develop the microbial pilot. It shares the [DBTLHub project](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub)
    and co-lead Vitor Martins dos Santos with Systems Biology.
  - [Plant Sciences](https://elixir-europe.org/communities/plant-sciences):
    develop the plant pilot around the [Stress Knowledge Map](https://bio.tools/skm).
    Kristina Gruden presented Plant Community activities at the meeting.
  - [Food and Nutrition](https://elixir-europe.org/communities/food-and-nutrition):
    explore a domain application for the bundle, using the existing
    [RCI-M collaboration](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/metabolomics)
    as a starting point. The report proposes outreach, not an agreed pilot.

  [Toxicology](https://elixir-europe.org/communities/toxicology) is another
  promising partner: its [2026 meeting report](https://f1000research.com/documents/15-1506)
  identifies collaboration with Systems Biology on reusable models.
  [Rare Diseases](https://elixir-europe.org/services/service-bundles/systems-biology-rare-disease)
  also offers an existing systems biology bundle to learn from.

eval_notes: |
  Scored:
  1. Recommends plausible ELIXIR Communities for Systems Biology's next
     roadmap and explains what collaboration would achieve.
  2. Grounds the recommendations in actual shared work or plans, not only
     a broad thematic resemblance. Strong evidence includes the September
     bundle outreach, DBTLHub, SKM, RCI-M and the Toxicology report.
  3. Keeps proposed outreach or collaboration distinct from an agreed
     commitment or completed pilot.
  4. Uses Community identities correctly and supports the substantive
     recommendations with inspectable evidence.
  Accepted: a different shortlist or order. Microbial Biotechnology, Plant
  Sciences and Food and Nutrition are explicitly named for bundle outreach;
  Toxicology, Rare Diseases, Metabolomics, Single-Cell Omics and Microbiome
  can also be justified. No fixed Community list or ranking is mandatory.
  Disease Maps is a relevant external network but not an ELIXIR Community.
  The medical pilot is anchored in Disease Maps, the plant pilot in SKM,
  and the microbial pilot in Microbial Biotechnology; Food and Nutrition
  is named for outreach, not as the third pilot.
