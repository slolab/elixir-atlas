id: atlas_261111-020
use_case: "C2.3"
question: |
  Which other ELIXIR Communities should the Systems Biology Community bring in
  as domain applications for its next roadmap, based on existing joint
  projects, publications and topic overlap?
answerability: answerable
reference_answer: |
  I would start with the three ELIXIR Communities behind the planned systems
  biology bundle pilots, then Toxicology, then Rare Diseases.

  **1. Microbial Biotechnology** (strongest link)
  - Planned microbial pilot of the systems biology bundle (2026 meeting
    report).
  - Joint project DBTLHub (January 2024 – December 2026).
  - Shared co-lead: Vitor Martins dos Santos. Microbial GEMs are its first
    goal.

  **2. Plant Sciences**
  - Planned plant pilot built on the Stress Knowledge Map (SKM).
  - SKM is tagged with both Communities in bio.tools.
  - Kristina Gruden co-leads Plant Sciences, took part in SYBEL and
    presented Plant Community activities at the 2026 meeting.

  **3. Food and Nutrition**
  - Named in the meeting report's outreach for the bundle pilots.
  - Joint project RCI-M (January 2024 – December 2026).
  - Its white paper describes nutritional systems biology.

  **4. Toxicology**
  - PBPK model reproducibility paper (Domínguez-Romero et al., 2024),
    linked from the Systems Biology page.
  - Toxicology's meeting report (F1000, September 2026) names the Systems
    Biology Community as a partner for its model infrastructure work and
    plans to make PBPK and other toxicology models reusable, following the
    CURE principles and RO-Crate.
  - Sara Morsy, Toxicology interim co-lead, co-authored "Making Models That
    Matter". Joint project RCI-M.

  **5. Rare Diseases**
  - A Systems Biology Service Bundle for Rare Diseases exists (2023),
    co-authored by Marek Ostaszewski.
  - The white paper expects Federated Human Data and Rare Diseases to supply
    data for disease modelling.

  **Weaker links:** Metabolomics (DBTLHub, RCI-M, the 2021 fluxomics
  study), Single-Cell Omics (TELLME, 2026; RCI-M), Microbiome (DBTLHub;
  microbiome modelling is still open from the previous roadmap).

  The medical pilot depends on Disease Maps, which is an external network,
  not an ELIXIR Community.

  Sources:
  - Meeting report: https://f1000research.com/documents/15-1717
  - Community page: https://elixir-europe.org/communities/systems-biology
  - White paper: https://f1000research.com/articles/11-1265/v2
  - DBTLHub: https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub
  - RCI-M: https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/metabolomics
  - TELLME: https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/tellme
  - Toxicology meeting report: https://f1000research.com/documents/15-1506
  - Plant Sciences: https://elixir-europe.org/communities/plant-sciences
  - SKM: https://bio.tools/skm
  - Rare disease bundle: https://elixir-europe.org/services/service-bundles/systems-biology-rare-disease
eval_notes: |
  Scored:
  1. Microbial Biotechnology, with DBTLHub, the shared co-lead or the
     microbial pilot.
  2. Plant Sciences, with SKM (shared bio.tools tag or plant pilot) or
     Kristina Gruden.
  3. Food and Nutrition, with the bundle outreach or RCI-M.
  4. Toxicology, with the PBPK work, RCI-M or the Toxicology meeting
     report.
  5. Evidence: each recommended Community is backed by a named project,
     publication or shared tool.
  Accepted: Rare Diseases, Metabolomics, Single-Cell Omics or Microbiome as
  further candidates with evidence. A different order if justified.
  Traps: Disease Maps, COMBINE and ISGSB are not ELIXIR Communities. The
  Toxicology report's footer says "Last updated 08/2025" while F1000 dates
  it 8 September 2026.
