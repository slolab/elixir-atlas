id: atlas_261111-017
use_case: "C1.3"
question: |
  Any good courses or tutorials on genome-scale metabolic modelling?
answerability: answerable
reference_answer: |
  For tutorials you can use now:

  - [COBRA Toolbox tutorials](https://tess.elixir-europe.org/materials/constraint-based-reconstruction-and-analysis-toolbox-tutorials)
    cover a range of constraint-based methods with MATLAB examples, from
    beginner to advanced topics.
  - [Introduction to CellNetAnalyzer](https://tess.elixir-europe.org/materials/introduction-to-cellnetanalyzer)
    covers analysis of metabolic networks, including flux balance analysis.
  - [COBREXA tutorials](https://tess.elixir-europe.org/materials/tutorials-on-cobrexa)
    offer tutorials and notebooks for metabolic modelling in Julia, with
    more advanced material on large analyses.

  Two upcoming courses are listed:

  - [CellNetAnalyzer and CNApy: advanced topics](https://tess.elixir-europe.org/events/constraint-based-modeling-of-metabolic-networks-with-cellnetanalyzer-and-cnapy-module-2-advanced-topics),
    online on **19 November 2026**. It builds on the introductory module;
    that module took place on 5 November.
  - [Constraint-Based Modeling: Introduction and Advanced Topics](https://tess.elixir-europe.org/events/constraint-based-modeling-introduction-and-advanced-topics-2027),
    **1–5 February 2027 in Maastricht**, covers genome-scale metabolic
    networks for biotechnology and systems biomedicine.

  For a first introduction, I would work through a tutorial before joining
  the advanced CNApy session.
eval_notes: |
  Scored:
  1. Offers relevant learning resources with enough description to choose
     between them; a catalogue of unrelated systems biology courses is
     insufficient.
  2. Correctly describes the tutorials or course content. Verified options
     include COBRA Toolbox tutorials, CellNetAnalyzer, COBREXA tutorials,
     large-model COBREXA material and differentiable constraint-based models.
  3. Uses dates and delivery format accurately for any events recommended
     as upcoming. CNApy Module 2 is online on 19 November 2026; the
     Maastricht course is 1–5 February 2027. Module 1 on 5 November is past.
  4. Gives usable resource links and distinguishes introductory from
     advanced material when recommending a learning route.
  Accepted: self-paced tutorials only, courses only, a different evidenced
  selection, or a follow-up about experience after offering starting points.
  No particular number of resources or event is mandatory. Do not require
  TeSS collection membership or formal endorsement labels; a Community
  collection is a curated list, not proof of official recommendation. A
  past event may be useful as recorded material if clearly labelled and
  access to that material is established. Dynamic modelling courses may be
  adjacent background but should not be passed off as GEM-specific courses.
