id: atlas_261111-007
use_case: B2
question: |
  What did Estonia sign up to do in STEERS?
answerability: partially_answerable
reference_answer: |
  The public records connect Estonia, through the **University of Tartu**, to workflow optimisation and three areas of Node development:

  | Work | Associated project outputs |
  | --- | --- |
  | [Reduce the environmental impact of computational workflows, Task 3.4](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp3) | [Optimisation strategy M3.4](https://doi.org/10.5281/zenodo.17035147), due July 2025, and [proof-of-concept M3.5](https://doi.org/10.5281/zenodo.20759675), due January 2026. |
  | [Improve Node operations, Task 4.1](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4) | Node Development Almanac, D4.2, [due January 2027](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/deliverables). |
  | [Develop Node management skills, Task 4.2](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4) | Expanded ELITMa training, including [M4.1](https://doi.org/10.5281/zenodo.20761901), and publishing the new materials as D4.3, [due January 2027](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/deliverables). |
  | [Build training skills for Node staff, Task 4.3](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4) | [Customised training programme D4.1](https://doi.org/10.5281/zenodo.20759756), due January 2026 and delivered in March 2026. |

  Hedi Peterson is named in the website's leadership lists for all four tasks. These are shared project outputs, not deliverables assigned solely to Estonia. The [project handbook](https://doi.org/10.5281/zenodo.18469231) names other designated task leaders and deliverable leads.

  The public documents do not specify Tartu's exact share of each task or its staff effort, so they give a contribution map rather than a complete account of Estonia's commitment.
eval_notes: |
  Intent: establish Estonia's substantive STEERS commitments. Interpret Estonia as the ELIXIR Node represented by the University of Tartu. Distinguish shared task participation from sole delivery responsibility.

  Scored:
  1. Identifies Tartu's involvement in environmental-impact optimisation of computational workflows, Task 3.4.
  2. Identifies its involvement in Node operations and development, Task 4.1.
  3. Identifies its involvement in Node management capacity and ELITMa, Task 4.2, and training skills for Node staff, Task 4.3.
  4. Explains what the contribution concerns through concrete activities or associated outputs, without assigning the whole task or deliverable to Tartu.
  5. Makes the limit of the answer clear: public involvement and role lists do not establish Tartu's precise task allocation or effort.

  Accepted: plain-language task descriptions without task numbers, a concise overview without every milestone, and the D1.3 or D1.6 handbook. Exact dates are useful but not mandatory for this question. Funding and governance rosters are not required.

  Evidence notes: the WP3 and WP4 webpages name Hedi Peterson in task leadership lists, while handbook Table 14 names other designated task leaders. Heleri Inno contributes to M3.4 and Uku Raudvere to M3.5. The M3.5 report was completed 30 April 2026 but says the project requirements were met within the projected timeframe; do not call the implementation itself late. D4.1's actual delivery was 5 March 2026 versus 31 January 2026 contractual delivery. Do not confuse STEERS D4.1 with the Training Platform's FAIR-training guide.
