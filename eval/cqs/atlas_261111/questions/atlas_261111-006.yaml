id: atlas_261111-006
use_case: B1
question: |
  What projects has ELIXIR Estonia been involved in?
answerability: answerable
reference_answer: |
  Estonia has taken part in EU projects, Platform work, Commissioned Services and staff exchanges.

  **Recent work**

  | Project | Period |
  | --- | --- |
  | [ELIXIR-STEERS](https://cordis.europa.eu/project/id/101131096), through the University of Tartu | February 2024–January 2027 |
  | [ELIXIR Node support](https://elixir-europe.org/how-we-work/scientific-programme/nodes/support) | January 2024–December 2026 |
  | [Compute](https://doi.org/10.5281/zenodo.12819244), [Tools](https://doi.org/10.5281/zenodo.16993903) and [Training](https://doi.org/10.5281/zenodo.12516053) Platform work plans | 2024–2026 |
  | [DATAREX](https://elixir-europe.org/internal-projects/commissioned-services/datarex) | January 2024–December 2025 |

  **Earlier projects**

  - EU projects: [ELIXIR-CONVERGE](https://cordis.europa.eu/project/id/871075), February 2020–July 2023, and [ELIXIR-EXCELERATE](https://cordis.europa.eu/project/id/676559), September 2015–August 2019. The University of Tartu participated in both.
  - 2023–2024: [standardising machine learning in life sciences](https://elixir-europe.org/internal-projects/commissioned-services/2023-MLstandards).
  - 2022–2023: [Beacon Infrastructure](https://elixir-europe.org/internal-projects/commissioned-services/2022-beacon-infrastructure), [bio.tools and EDAM](https://elixir-europe.org/internal-projects/commissioned-services/2022-etp3), [Federated EGA](https://elixir-europe.org/internal-projects/commissioned-services/2022-fhd), [TeSS](https://elixir-europe.org/internal-projects/commissioned-services/2022-tess) and [TeSS training quality and impact](https://elixir-europe.org/internal-projects/commissioned-services/2022-trp3).
  - 2021–2023: [Tools Platform Ecosystem](https://elixir-europe.org/internal-projects/commissioned-services/tools-platform-ecosystem); in 2021, [standardising fluxomics workflows](https://elixir-europe.org/internal-projects/commissioned-services/fluxomics-workflows).
  - 2019–2021: [capacity building in interoperability](https://elixir-europe.org/internal-projects/commissioned-services/capacity-building) and [Federated Human Data](https://elixir-europe.org/internal-projects/commissioned-services/federated-human-data).
  - 2018–2019: [metabolite identification](https://elixir-europe.org/internal-projects/commissioned-services/metabolite-identification), [data stewardship training and portal](https://elixir-europe.org/internal-projects/commissioned-services/towards-data-stewardship) and [learning paths](https://elixir-europe.org/internal-projects/commissioned-services/learning-paths-2018).
  - 2017: [ELIXIR integration from a user perspective](https://elixir-europe.org/internal-projects/commissioned-services/elixir-integration-user-perspective).
  - 2015–2016: [Data Carpentry and Software Carpentry](https://elixir-europe.org/internal-projects/commissioned-services/data-carpentry).

  **Staff exchanges** include the [bioinformatics and statistics workshop with ELIXIR Czech Republic](https://elixir-europe.org/internal-projects/staff-exchange-programme/bioinformatics-stats), March–May 2025, and [preparing the Data Steward Handbook](https://elixir-europe.org/internal-projects/staff-exchange-programme/ds-handbook), October 2024–March 2025.
eval_notes: |
  Intent: give a useful view of Estonia's project involvement. The question does not specify a historical cutoff, project taxonomy, exact dates or an exhaustive list. A clearly scoped recent overview and a broader history are both reasonable; assess the breadth the answer claims.

  Scored:
  1. Identifies STEERS and the University of Tartu's involvement. If describing earlier EU projects, correctly attributes CONVERGE and EXCELERATE to Tartu.
  2. Identifies Estonia's Platform or Node support involvement with concrete projects, rather than treating its portfolio as EU grants alone.
  3. Provides a useful view of service or exchange work within its stated period, with correct Estonia participation. For a historical overview, supported examples include DATAREX, machine-learning standards, the 2022–2023 services and the two staff exchanges.
  4. Keeps current and ended work distinct wherever it makes a status claim, and does not assert exhaustiveness from a small selection.

  Accepted: grouping by period or project type; a clearly labelled selection rather than every reference item. Exact start and end days are not required. Do not apply the old “12 of 16” threshold. Other supported projects may be included. A useful answer focused on current involvement can omit historical examples if it states that scope.

  Evidence notes: CORDIS confirms the three EU grants and Tartu as participant. The older Platform webpages and 36-month work plans disagree on end dates; answers can use either with clear attribution. Merely hosting an event in Tartu does not establish Node participation: the ELITMa Module 2 staff exchange lists only the Netherlands. DATAREX ended in December 2025. IMI-EMIF on the Node page should not be called an ELIXIR project without further evidence.
