id: atlas_261111-006
use_case: "B1"
question: |
  I work for ELIXIR Estonia. Which ELIXIR projects has our Node taken part
  in, current and past? Please cover EU-funded projects, Commissioned
  Services and Implementation Studies, and staff exchanges, with the dates of
  each.
answerability: answerable
reference_answer: |
  The ELIXIR Estonia Node page lists services and leadership but no projects.
  The list below comes from CORDIS and from the project pages on
  elixir-europe.org that name ELIXIR Estonia under "Nodes involved". Status is
  as of 11 November 2026.

  **EU projects** (University of Tartu, TARTU ULIKOOL, is a participant in
  all three):
  - ELIXIR-STEERS, grant 101131096: 1 February 2024 to 31 January 2027.
    Current.
  - ELIXIR-CONVERGE, grant 871075: 1 February 2020 to 31 July 2023.
  - ELIXIR-EXCELERATE, grant 676559: 1 September 2015 to 31 August 2019.

  **Running in 2026:**
  - ELIXIR Node support (Scientific Programme): January 2024 to December 2026.
  - ELIXIR Compute, Tools and Training Platforms (2024-26): the project pages
    give January 2024 to January 2026, but the work plans on Zenodo are
    2024-2026 plans over 36 months (M01 to M36). The two sources disagree on
    the end date.

  **Earlier Commissioned Services and Implementation Studies:**
  - DATAREX, Data Management for Research in ELIXIR: January 2024 to
    December 2025
  - A framework to standardize machine learning in life sciences (2023-24):
    January 2023 to January 2024
  - Five 2022-23 services, each January 2022 to January 2023: ELIXIR Beacon
    Infrastructure Service; bio.tools registry and EDAM ontology; Federated
    EGA framework; TeSS, the ELIXIR training portal; Consolidating quality
    and impact of the TeSS training resources
  - Tools Platform Ecosystem: June 2021 to May 2023
  - Standardising the fluxomics workflows: June to November 2021
  - Capacity building in interoperability: June 2019 to December 2021
  - ELIXIR Federated Human Data (2019-21): January 2019 to January 2021
  - Metabolite identification: June 2018 to December 2019
  - Towards Data Stewardship in ELIXIR: Training and Portal: January 2018 to
    June 2019
  - Developing learning paths for users of ELIXIR services: January 2018 to
    June 2019
  - ELIXIR integration from a user perspective: January to December 2017
  - Building the foundation for Data Carpentry and Software Carpentry within
    ELIXIR: January 2015 to January 2016

  **Staff exchanges:**
  - Bioinformatics and statistical skills training workshop (SEP 2025-08),
    with ELIXIR Czech Republic: March to May 2025
  - Preparing the Data Steward Handbook for early publication (SEP 2024-02):
    October 2024 to March 2025

  Sources:
  - Node page: https://elixir-europe.org/about-us/who-we-are/nodes/estonia
  - CORDIS: https://cordis.europa.eu/project/id/101131096,
    https://cordis.europa.eu/project/id/871075,
    https://cordis.europa.eu/project/id/676559
  - Node support: https://elixir-europe.org/how-we-work/scientific-programme/nodes/support
  - Platforms: https://elixir-europe.org/internal-projects/commissioned-services/2024-compute,
    https://elixir-europe.org/internal-projects/commissioned-services/2024-tools,
    https://elixir-europe.org/internal-projects/commissioned-services/2024-training;
    work plans https://doi.org/10.5281/zenodo.12819244 (Compute),
    https://doi.org/10.5281/zenodo.16993903 (Tools),
    https://doi.org/10.5281/zenodo.12516053 (Training)
  - Earlier services: the pages under
    https://elixir-europe.org/internal-projects/commissioned-services/
    (datarex, 2023-MLstandards, 2022-beacon-infrastructure, 2022-etp3,
    2022-fhd, 2022-tess, 2022-trp3, tools-platform-ecosystem,
    fluxomics-workflows, capacity-building, federated-human-data,
    metabolite-identification, towards-data-stewardship, learning-paths-2018,
    elixir-integration-user-perspective, data-carpentry)
  - Staff exchanges: https://elixir-europe.org/internal-projects/staff-exchange-programme/bioinformatics-stats,
    https://elixir-europe.org/internal-projects/staff-exchange-programme/ds-handbook
eval_notes: |
  Scored:
  1. EU projects: STEERS (2024-2027, current), CONVERGE (2020-2023) and
     EXCELERATE (2015-2019), with University of Tartu as participant.
  2. Running in 2026: Node support (to December 2026) and the 2024-26
     Compute, Tools and Training Platforms. Either end date for the
     Platforms is accepted if the answer gives its source; noting the
     conflict is better.
  3. Earlier services: at least 12 of the 16 listed, with dates. No service
     that does not list ELIXIR Estonia.
  4. Staff exchanges: the two 2024-25 exchanges with dates.
  5. Every item has a source link.
  Accepted: grouping by type or by year; "Implementation Study" and
  "Commissioned Service" used interchangeably; the 2022-23 TeSS services
  named as "ETP3" or "TrP3".
  Traps: the ELITMa Module 2 staff exchange (2025) took place in Tartu but
  lists only ELIXIR Netherlands. Performance benchmarking (2019-21) does not
  involve Estonia. The Node page's "IMI-EMIF-Platform" is not an ELIXIR
  project. DATAREX and the 2022-23 services have ended.
