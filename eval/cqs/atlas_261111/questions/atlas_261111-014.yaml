id: atlas_261111-014
use_case: "B10"
question: |
  Which projects is ELIXIR-UK involved in? Is any of that funded?
answerability: partially_answerable
reference_answer: |
  Yes, some UK participation has documented EU funding. The public
  portfolio spans infrastructure, research, training and national projects.

  **Current work**

  - The UK is listed in the [Data](https://elixir-europe.org/how-we-work/scientific-programme/technology/data),
    [Interoperability](https://elixir-europe.org/how-we-work/scientific-programme/technology/interoperability),
    [Tools](https://elixir-europe.org/how-we-work/scientific-programme/technology/tools)
    and [Training](https://elixir-europe.org/how-we-work/scientific-programme/technology/training)
    work programmes, plus [Infrastructure Services](https://elixir-europe.org/how-we-work/scientific-programme/technology/infraserv).
    The [UK Compute page](https://elixiruknode.org/project/2024-technology-compute/)
    also names Manchester, although the current central page omits the UK.
  - Science projects include [DBTLHub](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub),
    [RCI-M](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/metabolomics),
    [Spatial2Galaxy](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/spatial2),
    [TELLME](https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/tellme),
    [BioDiv-FAIR-Checker](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/biodiv)
    and [FAIRferm](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/fairferm).
  - The UK also participates in [Node support](https://elixir-europe.org/how-we-work/scientific-programme/nodes/support),
    [PeoplePulse](https://elixir-europe.org/how-we-work/scientific-programme/people/peoplepulse)
    and [Train the Trainer](https://elixir-europe.org/how-we-work/scientific-programme/people/ttt).
    Its [own directory](https://elixiruknode.org/projects/) adds AgroServ,
    BioFAIR Methods Commons and FAIR-in-action bridge.

  **Funding and past work**

  [ELIXIR-STEERS](https://cordis.europa.eu/project/id/101131096) runs until
  January 2027. CORDIS records net EU contributions of €75,616 to Manchester
  and €62,192 to Earlham. Earlier funded participation includes
  [EXCELERATE](https://cordis.europa.eu/project/id/676559), which ended in
  2019, and [CONVERGE](https://cordis.europa.eu/project/id/871075), which ended
  in 2023.

  The reviewed Commissioned Service pages do not establish each UK partner's
  funding or in-kind status. The directories also disagree: the
  [UK E-PAN page](https://elixiruknode.org/project/e-pan-enhancing-pan-genome-analysis-in-plants/)
  runs to January 2027, while the [central page](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/e-pan)
  ends in May 2026. Treat this as a public overview to reconcile, not a complete
  financial register.
eval_notes: |
  Scored:
  1. Gives an evidenced portfolio spanning more than one type of work, such
     as Platform services, science projects, EU grants or national projects.
  2. Distinguishes current from past participation where dates are supplied:
     STEERS runs to January 2027; EXCELERATE ended in 2019 and CONVERGE in
     2023. A passed scheduled end is not proof of actual completion.
  3. Identifies documented UK grant funding, such as the STEERS beneficiaries
     Manchester (€75,616) and Earlham (€62,192), without confusing whole-
     project budgets with UK shares. Exact amounts are optional if not given.
  4. Does not infer in-kind work or individual salary funding from an absent
     public budget, institutional participation or a catalogue listing.
  5. Handles material uncertainty honestly: for example Compute's conflicting
     participation lists, E-PAN's conflicting dates, or incomplete coverage.
  Accepted: a current-only overview with its scope clear, a historical
  portfolio, or a different well-supported selection. The question does not
  limit the portfolio to the 2024–28 programme or ELIXIR's own EU grants;
  AgroServ and national projects are legitimate inclusions. Do not require
  an exact inventory, every beneficiary's amount, or projects the UK does
  not participate in. The current Compute page omits the UK, but its plan
  and the UK site establish Manchester's involvement. CORDIS's former
  zero-euro STEERS partner entries must not override its funded beneficiary
  entries. EMBL-EBI and ELIXIR UK are distinct.
