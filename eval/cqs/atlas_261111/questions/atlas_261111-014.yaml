id: atlas_261111-014
use_case: "B10"
question: |
  For ELIXIR-UK's national reporting, list the UK's ELIXIR project portfolio:
  the 2024–28 Commissioned Services and ELIXIR's EU grants (ELIXIR-EXCELERATE,
  ELIXIR-CONVERGE, ELIXIR-STEERS) that involve ELIXIR UK, whether each is
  current or ended as of November 2026, and whether UK partners receive EU
  grant money or contribute in-kind. As gaps, list the 2024–28 Platform and
  Science-area projects that do not list ELIXIR UK, and the projects where
  the ELIXIR website and the ELIXIR-UK website disagree.
answerability: partially_answerable
reference_answer: |
  **2024–28 Commissioned Services that list ELIXIR UK** (elixir-europe.org)
  - Current: the Data, Interoperability, Tools and Training Platforms and
    Infrastructure Services (January 2024 to December 2026); Node support and
    PeoplePulse (to December 2026); Train the Trainer (to January 2027);
    BioDiv-FAIR-Checker and FAIRferm (January to December 2026); DBTLHub,
    RCI-M metabolomics and Spatial2Galaxy (to December 2026); FAIR annotation
    workflows for PDBe-KB and TELLME (2026).
  - Ended: FHDportal and "Leveraging federated learning and RO-Crates"
    (January 2026), E-PAN (May 2026), HARVEST (June 2026).

  **EU grants (CORDIS, net EU contribution to UK beneficiaries)**
  - ELIXIR-EXCELERATE, September 2015 to August 2019, ended: Manchester
    €528,281; Cambridge €315,165; Oxford €242,958; Earlham €183,750;
    Heriot-Watt €105,433.
  - ELIXIR-CONVERGE, February 2020 to July 2023, ended: Manchester €139,933;
    Cambridge €93,350; Oxford €58,833. The ELIXIR-UK site also names
    Bradford, Cardiff, Newcastle, Dundee and Birmingham, which are not
    beneficiaries in CORDIS.
  - ELIXIR-STEERS, February 2024 to January 2027, current: Manchester
    €75,616; Earlham €62,192. CORDIS also lists both as partners whose
    participation ended (€0).

  **Funded or in-kind.** For the Commissioned Services, no public source
  gives per-Node funding or says whether UK work is funded or in-kind.
  For the EU grants, only
  the CORDIS beneficiaries above receive EU money. No source states that the
  other UK institutions contributed in-kind.

  **Gaps: 2024–28 projects that do not list ELIXIR UK**
  - Platforms: Compute (page lists Czech Republic, Finland, Germany,
    Luxembourg, Netherlands, Switzerland).
  - Biodiversity, food security and pathogens: Odyssey, non-human pathogen
    metadata standards, FAIR plant virtual assistant, FAIRyMAGs, KYBELE.
  - Cellular and molecular research: FRET-IDP Community Resource, structural
    and functional ontologies of disordered proteins.
  - Human data and translational research: FAIR-FEGA, Empowering users,
    FEGA-Connect.
  - ELIXIR UK takes part in all three Science areas and in four of the five
    Platforms.

  **Where the two websites disagree**
  - Compute Platform: the ELIXIR-UK site lists it (University of Manchester,
    Stian Soiland-Reyes), and the work plan names Manchester. The current
    ELIXIR page does not list the UK; the older 2024-26 page does.
  - E-PAN: the ELIXIR-UK site shows it as current, January 2024 to January
    2027. The ELIXIR page gives January 2025 to May 2026.
  - The ELIXIR-UK projects page omits ELIXIR-STEERS, ELIXIR-EXCELERATE and
    every 2024–28 service that lists ELIXIR UK except the Data,
    Interoperability and Tools Platforms and E-PAN.

  Sources:
  - 2024–28 project pages under https://elixir-europe.org/how-we-work/scientific-programme
    (technology/*, nodes/support, people/*, science/bfsp/*, science/cmr/*,
    science/hdtr/*)
  - Older Compute page: https://elixir-europe.org/internal-projects/commissioned-services/2024-compute
  - Compute work plan: https://zenodo.org/records/12819244
  - CORDIS: https://cordis.europa.eu/project/id/676559,
    https://cordis.europa.eu/project/id/871075,
    https://cordis.europa.eu/project/id/101131096
  - ELIXIR-UK projects: https://elixiruknode.org/projects/,
    https://elixiruknode.org/project/2024-technology-compute/,
    https://elixiruknode.org/project/e-pan-enhancing-pan-genome-analysis-in-plants/,
    https://elixiruknode.org/project/elixir-converge/
eval_notes: |
  Scored:
  1. 2024–28 services with ELIXIR UK, split into current and ended (at
     least the four Platforms, E-PAN and HARVEST as ended, and the
     HDTR projects FHDportal and federated learning as ended).
  2. EU grants: EXCELERATE and CONVERGE ended, STEERS current, with the UK
     beneficiaries and their EU contributions from CORDIS.
  3. Funded or in-kind: states that no public source gives Node funding or
     in-kind status for the Commissioned Services; nothing is invented.
  4. Gaps: Compute as the one Platform without the UK, and the Science
     projects without the UK.
  5. Website disagreements: Compute, E-PAN dates, and services missing from
     the ELIXIR-UK projects page.
  Accepted: adding other EU projects from the ELIXIR-UK site (AgroServ
  current; EOSC-Life, BY-COVID, FAIRplus, EJP RD, FAIR-IMPACT, BioDT
  ended) or national projects (BioFAIR Methods Commons, FAIR-in-action
  bridge, ELIXIR-UK DaSH), if marked as outside ELIXIR's own projects.
  Treating the Compute Platform as a UK project with the conflict flagged.
  Traps: the ELIXIR-UK site's project budgets for EU projects are whole-
  project totals, not UK shares. ELEAD 2.0 lists no Nodes at all, so it is
  not a UK gap. EMBL-EBI is not ELIXIR UK. DATAREX and the Toxicology
  integration project (2024–2025) are ELIXIR-funded but not on the 2024–28
  Programme pages.
