id: atlas_261111-010
use_case: B5
question: |
  Does Estonia's STEERS training work overlap with other ELIXIR projects?
answerability: answerable
reference_answer: |
  **Yes—the clearest overlap is with the Training Platform, and the plans describe it as complementary work.**

  - **Train-the-Trainer:** [Training Platform WP4](https://doi.org/10.5281/zenodo.12516053) explicitly links its work on training resources, impact assessment and onboarding to STEERS Tasks 4.1 and 4.3. Priit Adler represents Estonia in this work. From the other side, [STEERS Task 4.3](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4) builds on the ELIXIR-GOBLET Train-the-Trainer programme and names Hedi Peterson among its task leadership.
  - **Training Coordinator roles and onboarding:** the same [Training Platform plan](https://doi.org/10.5281/zenodo.12516053), WP3, links these activities to STEERS Tasks 4.1–4.3. Estonia is not listed among that WP's partners.
  - **Broader Node capacity building:** [Node support](https://elixir-europe.org/how-we-work/scientific-programme/nodes/support) also covers training and knowledge exchange, with Estonia involved. This is a topic overlap; its page does not state a direct STEERS link.

  The [STEERS training programme report](https://doi.org/10.5281/zenodo.20759756) describes joint delivery with the Training Platform. The evidence supports coordination and reuse, not a claim that Estonia is being asked to deliver the same work twice.
eval_notes: |
  Intent: identify overlap around Estonia's STEERS training work and explain whether the connection is substantive. The question does not identify a task number and can reasonably include both staff-training skills and management training.

  Scored:
  1. Identifies the Training Platform as a concrete overlap, explaining the shared Train-the-Trainer or Node-staff training work rather than only matching the word training.
  2. Supports the connection with an explicit link in the work plans or a documented joint activity; distinguishes it from an overlap inferred only from subject matter.
  3. Connects Estonia to the relevant work through a documented role, such as Priit Adler in Training WP4 or Hedi Peterson in STEERS.
  4. Does not equate complementary work with duplicated deliverables or double funding without evidence.

  Accepted: the Training Platform as the main answer without listing every adjacent project. WP3 onboarding, Node support, ELITMa-related work and staff exchanges may be included if their relationship is accurately described. Plain-language explanations without task numbers are sufficient. No extra credit is attached to a particular person's name.

  Evidence notes: Training WP4 explicitly links to STEERS Tasks 4.1 and 4.3; WP3 also links Coordinator roles and onboarding to Tasks 4.1–4.3. Priit Adler is a WP4 member and expected Activity 2 member, not a WP3 partner. The Czech–Estonian 2025 staff exchange trains researchers in bioinformatics and statistics, which is adjacent to but different from training trainers. STEERS D4.1 is distinct from Training Platform D4.1.
