id: atlas_261111-012
use_case: "B8"
question: |
  Does the FAIR-FEGA page need updating?
answerability: partially_answerable
reference_answer: |
  Yes. I would review the dates first, then check whether two recent FEGA
  publications belong on the page.

  - **Dates:** the [FAIR-FEGA page](https://elixir-europe.org/how-we-work/scientific-programme/science/hdtr/fair-fega)
    still says January 2025 to January 2026. The [ELIXIR Annual Report 2025](https://elixir-europe.org/sites/default/files/documents/elixir-AnnualReport2025.pdf)
    includes FAIR-FEGA among projects scheduled to run through 2026.
    Confirm the project's end date before replacing it; the report does
    not give a precise revised date for FAIR-FEGA.
  - **Possible additions:** the [FEGA Metadata Technical Report](https://zenodo.org/records/19388370),
    published 2 April 2026, describes the EGA v2 metadata model under
    development. The [FEGA white paper](https://zenodo.org/records/23157797),
    published 5 October 2026, sets out the federation's future direction.
    They are relevant to the project, but the records do not establish them
    as FAIR-FEGA deliverables. Confirm that attribution before listing them
    as project outputs.

  The public evidence supports an editorial review, but not a confirmed
  new completion date or a claim that these outputs fulfil FAIR-FEGA's
  commitments.
eval_notes: |
  Scored:
  1. Identifies a concrete update need: the project page's January 2026 end
     conflicts with newer evidence that the HDTR projects run through 2026.
  2. Does not invent a precise revised FAIR-FEGA date from the area's
     December 2026 date or infer actual completion from a scheduled end.
  3. If recommending additions, accurately distinguishes related material
     from confirmed FAIR-FEGA outputs. A date-focused answer need not
     discover or include the newer FEGA publications.
  4. Gives an evidence-based editorial recommendation with a source that
     the editor can inspect.
  Accepted: a date-focused answer alone, other supported updates, or a
  proposed edit with unresolved facts marked. Related publications are
  optional, not an extra condition for a complete answer.
  The prompt does not require the page's creation/edit timestamps, a
  complete change log, or a prescribed source search. The June 2025
  'Unifying FEGA metadata' poster is relevant background but not a new output
  since the page was published on 30 June 2025. The EGA v2 report describes
  work in progress, not a completed production migration.
