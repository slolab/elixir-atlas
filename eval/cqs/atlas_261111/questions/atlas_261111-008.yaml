id: atlas_261111-008
use_case: "B3"
question: |
  Who in ELIXIR Estonia works on ELIXIR's current projects, and on which
  activity? I mean ELIXIR-STEERS, the 2024-26 work plans of the Compute,
  Tools and Training Platforms, and the ELIXIR Node support project.
answerability: partially_answerable
reference_answer: |
  Seven people from ELIXIR Estonia are named. All are at the University of
  Tartu except Kairi Koort (Tallinn University).

  - **Hedi Peterson** (Head of Node):
    - ELIXIR-STEERS: University of Tartu representative in the General
      Assembly and Estonia's member of the Heads of Nodes Committee; named in
      the leadership of Tasks 3.4, 4.1, 4.2 and 4.3; participant in
      milestone M4.1 (ELITMa expansion).
    - Tools Platform: partner in WP2 (Research Software Ecosystem), where she
      co-leads Activity 3 Outreach with Magnus Palmblad, and partner in WP3
      (software management, stewardship and standards).
    - Node support: listed among the people involved.
  - **Kairi Koort** (Deputy Head of Node): ELIXIR-STEERS deputy for Estonia
    in the Heads of Nodes Committee.
  - **Uku Raudvere** (Technical Coordinator): ELIXIR-STEERS, participant in
    milestone M3.5, proof-of-concept optimisations in a workflow management
    system (Task 3.4).
  - **Heleri Inno**: ELIXIR-STEERS, co-author of milestone report M3.4 on
    identifying the critical parts of workflows for optimisation.
  - **Kaur Alasoo**: Compute Platform, co-lead of WP4 Activity 2
    "Operationalise ELIXIR Cloud"; member of WP3 Activities 1 and 2
    (sensitive data access and sensitive processing environments).
  - **Priit Adler**: Training Platform, member of WP4 (Train-the-Trainer
    programme consolidation).
  - **Diana Pilvar** (Training Coordinator): Training Platform, co-author of
    D2.7 on Bioschemas for training events and materials (October 2025) and
    reviewer of D4.1, the guide to FAIRifying training materials (March
    2026). She is not named in the Training Platform work plan.

  **Not public:** how much time each person gives and who is paid by which
  project. The Compute Platform and Node support pages list ELIXIR Estonia
  without naming every Estonian contributor.

  Sources:
  - Node page: https://elixir-europe.org/about-us/who-we-are/nodes/estonia
  - STEERS: https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp3,
    https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4,
    https://doi.org/10.5281/zenodo.18469231 (D1.6 handbook),
    https://doi.org/10.5281/zenodo.17035147 (M3.4),
    https://doi.org/10.5281/zenodo.20759675 (M3.5),
    https://doi.org/10.5281/zenodo.20761901 (M4.1)
  - Platform work plans: https://doi.org/10.5281/zenodo.12819244 (Compute),
    https://doi.org/10.5281/zenodo.16993903 (Tools),
    https://doi.org/10.5281/zenodo.12516053 (Training)
  - Training Platform outputs: https://doi.org/10.5281/zenodo.17257903 (D2.7),
    https://doi.org/10.5281/zenodo.20098139 (D4.1)
  - Node support: https://elixir-europe.org/how-we-work/scientific-programme/nodes/support
eval_notes: |
  Scored:
  1. Hedi Peterson: STEERS governance (General Assembly, Heads of Nodes
     Committee) and STEERS tasks, plus Tools Platform WP2 Activity 3
     co-lead.
  2. Kaur Alasoo: Compute Platform WP4 Activity 2 co-lead.
  3. Priit Adler: Training Platform WP4 member.
  4. Uku Raudvere and Heleri Inno: STEERS WP3 workflow optimisation work
     (M3.5, M3.4). Kairi Koort: Heads of Nodes Committee deputy.
  5. Says time commitment and individual funding are not public.
  Accepted: Diana Pilvar omitted, or listed for the Training Platform
  outputs. "UT", "UTARTU" and "UTAR" for the University of Tartu.
  Traps: past projects are out of scope: DATAREX (ended December 2025;
  Diana Pilvar, Heleri Inno), the 2025 staff exchanges, Ulvi Talas in the
  2022-23 Beacon and Federated EGA services, and Kairi Koort in the 2018-21
  metabolomics services. Kaur Alasoo has no STEERS role in the data.
