id: atlas_261111-008
use_case: B3
question: |
  Who's doing what on Estonia's ELIXIR projects at the moment?
answerability: partially_answerable
reference_answer: |
  The current ELIXIR project plans and recent outputs name these contributors:

  | Person | Work |
  | --- | --- |
  | **Hedi Peterson** | Named in STEERS task leadership for [workflow optimisation](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp3) and [Node operations, management and training](https://elixir-europe.org/about-us/how-funded/eu-projects/steers/wp4). She also co-leads outreach in the [Tools Platform's research software work](https://doi.org/10.5281/zenodo.16993903), WP2 Activity 3, and is listed in [Node support](https://elixir-europe.org/how-we-work/scientific-programme/nodes/support). |
  | **Kaur Alasoo** | Co-leads “Operationalise ELIXIR Cloud”, WP4 Activity 2, and contributes to sensitive-data access work in the [Compute Platform plan](https://doi.org/10.5281/zenodo.12819244). |
  | **Priit Adler** | Contributes to consolidation of the Train-the-Trainer programme in [Training Platform WP4](https://doi.org/10.5281/zenodo.12516053). |
  | **Uku Raudvere** | Named participant in the [STEERS workflow optimisation proof-of-concept, M3.5](https://doi.org/10.5281/zenodo.20759675). |
  | **Heleri Inno** | Contributed to the [STEERS workflow optimisation strategy, M3.4](https://doi.org/10.5281/zenodo.17035147). |
  | **Diana Pilvar** | Co-authored the Training Platform's [Bioschemas report for training resources](https://doi.org/10.5281/zenodo.17257903) and reviewed its [guide to FAIRifying training materials](https://doi.org/10.5281/zenodo.20098139). |
  | **Kairi Koort** | Estonia's deputy on the STEERS Heads of Nodes Committee; Hedi Peterson is the main representative, according to the [project handbook](https://doi.org/10.5281/zenodo.18469231). |

  This is the public project record, not a live allocation of everyone's work. A plan or report credit shows a documented role or contribution; it does not establish what someone is doing today.
eval_notes: |
  Intent: identify people and their current ELIXIR project activities in Estonia. Do not require the user to know which projects to name. A general Node leadership directory alone does not answer which project work those people do.

  Scored:
  1. Identifies Hedi Peterson and connects her to substantive current work, such as the STEERS tasks, Tools outreach or Node support.
  2. Identifies Kaur Alasoo's Compute work, retaining the co-lead role for Operationalise ELIXIR Cloud when describing that activity.
  3. Identifies current Training work through Priit Adler, Diana Pilvar or both, with correct activities and role strength.
  4. Identifies further documented STEERS contributors with their actual role, such as Uku Raudvere, Heleri Inno or Kairi Koort; does not substitute names from unrelated completed projects.
  5. Keeps evidence dates and role types honest: a past output or planned participation is not proof of a person's live workload, task ownership or salary funding.

  Accepted: other supported contributors and project activities. No exact total of seven people or full governance roster is required. Node coordinators may be included when connected to specific project work. Individual funding or person-month figures are not requested and need not be discussed.

  Evidence notes: Compute WP4 Activity 2 names Kaur Alasoo as co-lead; WP3 names him among members. Tools WP2 Activity 3 names Hedi Peterson and Magnus Palmblad as co-leads. Priit Adler is a Training WP4 member. Diana Pilvar is named in the Training outputs, not in that work plan. The STEERS handbook identifies Kairi Koort as deputy in the Heads of Nodes Committee, which is a governance role rather than a technical task.
