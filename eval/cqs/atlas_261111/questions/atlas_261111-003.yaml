id: atlas_261111-003
use_case: A3
question: |
  How do I join the RDM Community?
answerability: answerable
reference_answer: |
  Go to the [ELIXIR Research Data Management Community page](https://elixir-europe.org/communities/research-data-management) and click **Join this Community**. Sign in or register, then request membership. After approval, you can access the Community's onboarding document.

  For help, or to join the mailing list, email [rdm@elixir-europe.org](mailto:rdm@elixir-europe.org). The same address reaches the co-leads.
eval_notes: |
  Intent: help the user join the ELIXIR Research Data Management Community. It is reasonable to interpret RDM from the ELIXIR context; a brief identification of the Community is sufficient.

  Scored:
  1. Gives the Community page's Join this Community route.
  2. Explains the approval requirement without implying that the restricted onboarding document can be read publicly or that approval can be bypassed.

  Accepted: a concise joining route without the co-leads, communication channels or help address. rdm@elixir-europe.org is a useful optional contact and a documented mailing-list entry route. An answer focused on joining the mailing list can use that address and distinguish mailing-list access from approved membership; assess that practical interpretation on its own terms. Life Sciences Login is one documented route, not the only permitted method. The exact button wording and optional preliminary reading in the framework need not be reproduced.

  Explicit sign-in or registration wording is optional when the answer gives an accurate, usable joining route and preserves the approval requirement.

  Evidence notes: the Community framework's joining instructions say Life Sciences Login “or other methods”. The public page names Munazah Andrabi, Mijke Jetten and interim co-lead Federico Bianchini, with Katharina Heil as liaison. Those names are not necessary to complete this request. The framework mentions Slack, but the Community page provides no channel link. Do not invent one. The RDM Trainer Network is a separate network within the Community.
