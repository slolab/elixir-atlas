id: atlas_261111-018
use_case: "C1.4"
question: |
  Who at ELIXIR should I talk to about genome-scale metabolic modelling?
answerability: answerable
reference_answer: |
  Start with the [Systems Biology Community](https://elixir-europe.org/communities/systems-biology):
  email [systems-biology-coleads@elixir-europe.org](mailto:systems-biology-coleads@elixir-europe.org).
  It links standard-GEM and constraint-based modelling resources. Its
  [meeting report](https://f1000research.com/documents/15-1717) confirms that
  contact address.

  For microbial models and strain engineering, contact the
  [Microbial Biotechnology Community](https://elixir-europe.org/communities/microbial-biotechnology)
  at [microbial-biotechnology-coleads@elixir-europe.org](mailto:microbial-biotechnology-coleads@elixir-europe.org).
  Developing microbial genome-scale models is one of its stated goals.
  Vitor Martins dos Santos co-leads both Communities.
eval_notes: |
  Scored:
  1. Identifies a relevant Community or person, such as Systems Biology
     for modelling generally or Microbial Biotechnology for microbial GEMs.
  2. Gives an accurate, usable contact route, such as a co-lead address,
     Community contact page, relevant lead or liaison.
  3. Explains why that route fits the question, without inventing roles,
     expertise or a direct link to the requester's unspecified project.
  Accepted: a concise referral, direct relevant people rather than mailing
  lists, or a more specialised route with a stated reason. Do not require
  co-lead name counts, the DBTLHub partnership, election details or a
  complete Community directory. The Systems Biology page's visible address
  is correct, but its mailto link incorrectly points to Single-Cell Omics;
  the meeting report confirms systems-biology-coleads@elixir-europe.org.
  Disease Maps and COMBINE are external networks, not ELIXIR Communities.
