id: atlas_261111-018
use_case: "C1.4"
question: |
  Which ELIXIR Communities work on genome-scale metabolic modelling, and how
  do I contact them?
answerability: answerable
reference_answer: |
  **Systems Biology Community** (main contact for modelling)
  - GEM work: promotes the standard-GEM template, links the bio.tools
    "Constraint-based modelling" domain, and its white paper covers MEMOTE,
    MetaNetX and Metabolic Atlas.
  - Co-leads: Carissa Bleker (ELIXIR Slovenia), Vitor Martins dos Santos
    (ELIXIR Netherlands), Miguel Rocha (ELIXIR Portugal). Community liaison:
    Mihail Anton (ELIXIR Hub), who also developed Metabolic Atlas.
  - Contact: systems-biology-coleads@elixir-europe.org. Join through the
    "Join this Community" link (ELIXIR Life Science Login).
  - https://elixir-europe.org/communities/systems-biology

  **Microbial Biotechnology Community** (microbial GEMs for strain design)
  - Its first goal is scalable microbial GEMs, with an evaluation suite for
    metabolic models.
  - Co-leads: Vitor Martins dos Santos (ELIXIR Netherlands), Anil Wipat
    (ELIXIR UK), Pablo Carbonell (ELIXIR Spain). Liaison: Katharina Heil
    (ELIXIR Hub).
  - Contact: microbial-biotechnology-coleads@elixir-europe.org or
    katharina.heil@elixir-europe.org.
  - https://elixir-europe.org/communities/microbial-biotechnology

  **How they connect**
  - Vitor Martins dos Santos co-leads both Communities.
  - Both take part in DBTLHub (January 2024 – December 2026), which draws on
    metabolic modelling, with the Biodiversity, Microbiome, Metabolomics and
    Research Data Management Communities.
    https://elixir-europe.org/how-we-work/scientific-programme/science/cmr/dbtlhub
  - The Metabolomics Community led "Standardising the fluxomics workflows"
    (June – November 2021), which used Rhea for metabolic model
    reconstruction. Contact: metabolomics-coleads@elixir-europe.org.

  **Note:** the Systems Biology page's email link points to
  single-cell-omics-coleads@elixir-europe.org, while its text shows
  systems-biology-coleads@elixir-europe.org; the meeting report confirms the
  systems-biology address. One Systems Biology co-lead position is in the
  2026 election, with results due in early December 2026.
eval_notes: |
  Scored:
  1. Communities: Systems Biology and Microbial Biotechnology.
  2. Systems Biology contact: systems-biology-coleads@elixir-europe.org and
     at least two of the three co-leads, or the liaison Mihail Anton.
  3. Microbial Biotechnology contact:
     microbial-biotechnology-coleads@elixir-europe.org or Katharina Heil,
     and at least two co-leads.
  4. Link: the shared co-lead Vitor Martins dos Santos or the joint DBTLHub
     project.
  Accepted: naming Metabolomics as a related Community through the fluxomics
  study or DBTLHub. Noting the mismatched email link.
  Traps: the Systems Biology page's mailto link goes to the Single-Cell
  Omics co-leads. Disease Maps and COMBINE are external networks, not ELIXIR
  Communities. The focus-groups/systems-biology URL is the same Community
  page.
