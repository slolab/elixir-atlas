id: atlas_261111-004
use_case: A4
question: |
  Does anyone have onboarding material for new Community members or co-leads?
answerability: partially_answerable
reference_answer: |
  Yes. **Start with the [RDM Community framework](https://doi.org/10.5281/zenodo.15235047)**: it describes membership, roles, ways of working, communication channels and how to join. It is a useful public example to adapt for another Community.

  The [RDM Community page](https://elixir-europe.org/communities/research-data-management) also offers an onboarding document after membership approval. Its contents are not available in the public snapshot, so I cannot say which parts of that document can be reused.

  Other useful starting points are:

  - The [Communities Handbook](https://f1000research.com/documents/13-80), for Community membership, co-lead roles and support from the Hub.
  - The [PeoplePulse Onboarding Protocol](https://doi.org/10.5281/zenodo.17202558), for welcome emails, meetings, mentoring and follow-up. It was written for Node members, so it needs adapting for a Community.
  - The Training Platform's [draft onboarding SOP](https://doi.org/10.5281/zenodo.20072664), for a structured process and checklist. It is for Training Coordinators, not Community co-leads, and is still a draft.

  For co-leads specifically, the [election timetable](https://elixir-europe.org/communities/co-lead-elections) schedules onboarding and handover from mid-December 2026 to mid-January 2027, but does not publish the content.
eval_notes: |
  Intent: find material that can be used or adapted for Community onboarding. The question does not require a particular Community example or proof that no other process exists.

  Scored:
  1. Identifies relevant, documented onboarding or orientation material, with its audience described accurately. Supported examples include RDM's framework, the Communities Handbook, PeoplePulse's protocol and the Training Platform's SOP; equivalent supported resources are acceptable.
  2. Explains what the user can use from the material, rather than giving a bare name or promising an inaccessible template.
  3. Preserves access and publication status: restricted contents are not treated as inspected, and drafts or adaptations are not presented as final Community-specific procedures.

  Accepted: a short recommendation focused on either members or co-leads. One well-chosen resource with a useful explanation can fully answer the request; neither RDM nor the full reference list is compulsory. Co-lead election dates are optional and are not a substitute for reusable material.

  Evidence notes: RDM's public framework includes the joining route, member roles, governance and channels, while its onboarding document requires approval. The Handbook includes links to joining guides and describes co-lead responsibilities. PeoplePulse M2.2 gives flexible onboarding formats and content for Node members. Training M3.12's executive summary calls the SOP a draft awaiting review and targets Training Coordinators. The restricted RDM document and the scheduled co-lead handover cannot be treated as publicly inspected templates.
