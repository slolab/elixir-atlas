id: atlas_261111-004
use_case: "A4"
question: |
  Which ELIXIR Communities document an onboarding process for new co-leads
  or new members, and which onboarding material could other Communities
  reuse? Please include links.
answerability: partially_answerable
reference_answer: |
  **Communities with a documented onboarding process**
  - **Research Data Management** is the only Community whose public page
    documents one. The page links an "ELIXIR RDM Community onboarding
    document", available after approval through "Join this Community". The
    public Community framework (v02, 2025) sets out who the Community is
    for, member roles (liaisons, working-group representatives), rules,
    channels, governance and a three-step joining route. The DATAREX
    Scientific End Report (2026) says the project developed "community
    frameworks and onboarding documents".
  - The onboarding document itself is not public, so its content cannot be
    checked.

  **ELIXIR-wide material for Communities**
  - Communities Handbook (2024): membership, the Hub liaison, mailing lists,
    Slack, and co-lead roles. It links "How to join an ELIXIR Community"
    guides for ELIXIR and non-ELIXIR members on Google Drive. It has no
    co-lead onboarding procedure.
  - Co-lead elections 2026–2027: plans an "onboarding and handover" period
    from mid-December 2026 to mid-January 2027, with new co-leads starting in
    January 2027. The content of that onboarding is not published.
  - The Communities Future Focus Group page does not mention onboarding.

  **Reusable material from outside the Communities**
  - PeoplePulse M2.2 "ELIXIR Onboarding Protocol" (2025): formats,
    checklists and content for onboarding new Node members, including
    onboarding into a specific Platform or Community.
  - Training Platform M3.12 "Onboarding SOP" (2026): onboarding of new
    Training Coordinators, building on M3.10 (2025).
  - The Equity, Diversity and Inclusion Focus Group plans guidance on
    inclusive onboarding. Nothing is published yet.

  Sources:
  - RDM Community page:
    https://elixir-europe.org/communities/research-data-management
  - RDM onboarding document (login):
    https://elixir-europe.org/documents/elixir-rdm-community-onboarding
  - RDM Community framework: https://doi.org/10.5281/zenodo.15235047
  - DATAREX Scientific End Report: https://doi.org/10.5281/zenodo.18508044
  - Communities Handbook: https://f1000research.com/documents/13-80
  - Co-lead elections: https://elixir-europe.org/communities/co-lead-elections
  - Communities Future Focus Group:
    https://elixir-europe.org/focus-groups/communities-future
  - PeoplePulse M2.2: https://doi.org/10.5281/zenodo.17202558
  - Training Platform M3.12: https://doi.org/10.5281/zenodo.20072664;
    M3.10: https://doi.org/10.5281/zenodo.17258995
  - EDI Focus Group:
    https://elixir-europe.org/focus-groups/equity-diversity-and-inclusion
eval_notes: |
  Scored:
  1. Research Data Management named as the Community with documented
     onboarding, with the onboarding document behind "Join this Community".
  2. The RDM Community framework on Zenodo as the public, reusable part,
     with link.
  3. States that no other Community page documents onboarding, and that the
     RDM onboarding document's content is not public.
  4. Handbook: covers joining and roles but has no co-lead onboarding
     procedure; elections page gives an onboarding and handover period
     without content.
  5. At least one reusable resource from outside the Communities with link
     (PeoplePulse Onboarding Protocol or Training Platform SOP).
  Accepted: the Handbook's "How to join" guides counted as member onboarding
  material.
  Traps: the RDM Trainer Network is part of RDM, not another Community. The
  Training Platform SOP is for Training Coordinators, not Community
  co-leads. "Onboarding snakemake" and FEGA onboarding posters are about
  software and data services.
