id: atlas_261111-016
use_case: "C1.2"
question: |
  Anything worth reading from ELIXIR on genome-scale metabolic models?
answerability: answerable
reference_answer: |
  I would start with these three:

  1. [standard-GEM: standardisation of open-source genome-scale metabolic models](https://www.biorxiv.org/content/10.1101/2023.03.21.512712v1.abstract)
     — a practical starting point for organising and sharing a model. The
     [Systems Biology Community](https://elixir-europe.org/communities/systems-biology)
     links it among its outputs.
  2. [Making Models That Matter](https://arxiv.org/abs/2609.13127)
     — a 2026 preprint on building trustworthy, reusable systems biology
     models. Its GEM-specific guidance includes standard-GEM and FROG
     reproducibility analysis.
  3. [Systems Biology in ELIXIR: modelling in the spotlight](https://f1000research.com/articles/11-1265/v2)
     — the Community white paper, useful for the wider landscape and its
     discussion of MEMOTE, MetaNetX and Metabolic Atlas.

  For the Community's latest priorities, the [September 2026 meeting report](https://f1000research.com/documents/15-1717)
  is a useful follow-up. It describes the systems biology bundle proposal
  and work still in progress, including an RDMkit page on models.
eval_notes: |
  Scored:
  1. Identifies relevant available reading connected to ELIXIR Systems
     Biology, with specific titles or usable links.
  2. Explains why the selection matters for genome-scale metabolic
     modelling. Verified practical material includes standard-GEM and the
     GEM-specific advice in Making Models That Matter; the Community white
     paper supplies wider context.
  3. Describes the documents accurately, including preprint status where
     relevant, rather than presenting all material as formal ELIXIR policy.
  4. Distinguishes available reading from planned outputs if discussing
     future work. The September meeting report says the RDMkit page is in
     progress with a December 2026 target, not already available.
  Accepted: a shorter selection, another well-supported reading order,
  or additional relevant material such as the 2018 microbial metabolism
  resource report. Do not require a status inventory, all three named
  papers, definitions of endorsement, or a list of unrelated Community
  papers. The fourth component does not apply when the answer recommends
  only available material and makes no claims about planned work.
