id: atlas_261111-009
use_case: B4
question: |
  Is Estonia getting any money from STEERS, or are we doing it in-kind?
answerability: answerable
reference_answer: |
  **Yes—Estonia is funded through the University of Tartu.** [CORDIS lists a net EU contribution of €67,500](https://cordis.europa.eu/project/id/101131096) to TARTU ULIKOOL for STEERS. This covers 80% of the university's declared project cost of €84,375, so its participation is not wholly in-kind.
eval_notes: |
  Intent: determine whether Estonia's STEERS participation receives funding. Interpret Estonia as the ELIXIR Node's participating institution, the University of Tartu.

  Scored:
  1. Correctly identifies the University of Tartu as an EU-funded STEERS participant, rather than a wholly in-kind contributor.
  2. Supports that conclusion with the participant-level funding evidence, keeping Tartu's award distinct from the total project grant or unrelated ELIXIR funding.

  Accepted: a direct funded/not-in-kind answer with a source identifying the funded participant. The exact award amount, total cost, percentage and individual-staff discussion are optional. If supplied, the net EU contribution is €67,500, total cost €84,375 and EU share 80%. The uncovered €16,875 must not be assigned to a particular funding source without evidence. An institutional award does not prove that any named person is paid from it.

  Evidence notes: CORDIS's TARTU ULIKOOL participant entry gives both figures. The whole project receives €3,200,000 from the EU; that is not Estonia's amount. Tartu's CONVERGE and EXCELERATE contributions are different awards.
