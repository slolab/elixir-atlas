id: atlas_261111-013
use_case: "B9"
question: |
  For ELIXIR Germany's (de.NBI) end-of-year report: which ELIXIR Commissioned
  Services that list ELIXIR Germany, and which EU projects of ELIXIR, have
  outputs on Zenodo dated 2026 (1 January to 11 November) with at least one
  author at a German institution? Name the outputs and those authors, and say
  which German-listed services running in 2026 have no such output.
answerability: partially_answerable
reference_answer: |
  29 Zenodo records from 2026 qualify. Every Commissioned Service below lists
  ELIXIR Germany among its Nodes.

  **E-PAN: Enhancing pan-genome analysis in plants** (BFSP WP2; page:
  January 2025 to May 2026). 8 records:
  - Deliverables D2.1 (31 May), D2.2, D2.3 (1 June), D2.5, D2.6 (17 Sept).
  - E-PAN Workshop 2026 (30 June): the event record, the white-paper overview
    and the PanBARLEX talk.
  - People: Sebastian Beier (Forschungszentrum Jülich), Heidrun Gundlach
    (Helmholtz Center Munich), Marc Christian Heuermann, Anne Fiebig,
    Patrick König, Uwe Scholz (IPK Gatersleben).

  **FAIRyMAGs** (BFSP WP3; page: January 2025 to June 2026). 11 records:
  - D3.1, D3.3, D3.5 and milestones M3.1, M3.2, M3.4, M3.5 (hackathon in
    Freiburg), all 1 June. Also D3.4 and a conference abstract (17 Sept),
    M3.3 (19 Sept) and M3.6, a bioRxiv preprint (5 Oct).
  - People: Paul Zierep, Mina Hojat Ansari (University of Freiburg).

  **HARVEST** (BFSP WP4; page: January 2025 to June 2026). 4 records:
  - D4.1, D4.2, D4.3, a preprint on plant data FAIRification (1 June), D4.5
    webinar (5 Oct).
  - People: Daniel Arend, Manuel Feser (IPK), Sebastian Beier, Daniel
    Wibberg (Forschungszentrum Jülich).

  **Building FAIR metadata standards for non-human pathogen data** (BFSP
  WP7; January to December 2026). 2 records: D7.1 gap analysis and M7.1
  (20 Sept). Person: Daniel Wibberg (Forschungszentrum Jülich).

  **ELIXIR Tools Platform** (January 2024 to December 2026). 1 record: the 2025 hybrid meeting
  report (8 Jan). Person: Björn Grüning (University of Freiburg).

  **DATAREX** (ended December 2025). 2 records: D3.3 on data brokering
  (6 Jan; Ulrike Wittig, HITS) and D2.4, the end report on learning paths in
  TeSS (30 Jan; Helena Schnitzer, Forschungszentrum Jülich).

  **ELIXIR-STEERS** (EU grant 101131096, February 2024 to January 2027). The
  University of Freiburg is a beneficiary (net EU contribution €86,600) and
  Björn Grüning is its General Assembly representative. 1 record: M3.5,
  proof-of-concept workflow optimisations (19 June; Björn Grüning with
  Nicola Soranzo, Earlham).

  **German-listed services running in 2026 with no such output:** the
  Compute, Data and Infrastructure Services Commissioned Services; Node
  support; PeoplePulse; the FAIR plant virtual assistant (BFSP WP8);
  RCI-M metabolomics; FAIR annotation workflows for PDBe-KB;
  Spatial2Galaxy. Empowering users (HDTR) and FEGA-Connect ended in January
  2026, also without one.

  **What is missing for a full report:** publications, posters, software
  and training outside Zenodo; what each German partner committed to in
  each plan; and per-Node funding. The de.NBI list of Commissioned Services
  with German contributions stops at 2023 projects.

  Sources:
  - Project pages: https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/e-pan,
    .../bfsp/fairymags, .../bfsp/harvest, .../bfsp/fairnhp,
    https://elixir-europe.org/how-we-work/scientific-programme/technology/tools,
    https://elixir-europe.org/internal-projects/commissioned-services/datarex
  - BFSP work plan v2 (WP numbering): https://zenodo.org/records/19469586
  - Outputs: https://zenodo.org/records/<id> for 20474120, 20480561,
    20487638, 22818002, 22818124, 21066927, 21062264, 21065633, 20490822,
    20491034, 20491762, 20492418, 20492676, 20492964, 20493091, 22818544,
    22819377, 22849644, 23169999, 20496587, 20497147, 20497338, 23170962,
    22860776, 22860916, 18187591, 17979335, 18454311, 20759675
  - ELIXIR-STEERS: https://cordis.europa.eu/project/id/101131096; handbook
    v3: https://zenodo.org/records/18469231
  - de.NBI list: https://www.denbi.de/commissioned-services-of-elixir-de
eval_notes: |
  Scored:
  1. BFSP outputs: E-PAN, FAIRyMAGs and HARVEST, with German authors from
     IPK, Forschungszentrum Jülich, Helmholtz Munich and Freiburg.
  2. The non-human pathogen metadata project (WP7) with Daniel Wibberg.
  3. ELIXIR-STEERS: Freiburg as beneficiary, Björn Grüning, and the M3.5
     record.
  4. At least two of: the Tools Platform meeting report, the DATAREX D3.3 or
     D2.4 reports.
  5. Names German-listed services without 2026 outputs and states what the
     data cannot show (non-Zenodo outputs, per-Node commitments, funding).
  Accepted: counts that differ by a few records if each record named is
  correct; adding the RDM Maturity Model (Jeanne Wilbrandt, FLI) as a
  probable DATAREX output; adding German Heads of Node from the STEERS
  handbook.
  Traps: outputs dated after the project's page end date (E-PAN deliverables
  in September) still count. The E-PAN D2.4 record has no German author. The
  older Training Platform page lists Germany but the 2024–28 page does not.
  EMBL Heidelberg is not ELIXIR Germany. The ELIXIR AI Strategy and the FEGA
  white paper have German authors but are not project outputs.
