id: atlas_261111-013
use_case: "B9"
question: |
  What has ELIXIR Germany delivered across its projects this year?
answerability: partially_answerable
reference_answer: |
  Public records show German contributions to several outputs published
  in 2026. These are useful highlights, rather than a complete annual report.

  | Project | Documented output | German contributors |
  | --- | --- | --- |
  | E-PAN | [Pan-genome completeness standards, 31 May](https://zenodo.org/records/20474120) | Sebastian Beier, Forschungszentrum Jülich; Heidrun Gundlach, Helmholtz Munich; colleagues at IPK |
  | FAIRyMAGs | [A metagenome-assembly workflow released through Galaxy and WorkflowHub, 1 June](https://zenodo.org/records/20490822) | Paul Zierep, University of Freiburg |
  | HARVEST | [Reference datasets packaged as RO-Crates, 1 June](https://zenodo.org/records/20496587) | Daniel Arend, IPK; Sebastian Beier, Forschungszentrum Jülich |
  | Non-human pathogen metadata standards | [Gap analysis, 20 September](https://zenodo.org/records/22860776) | Daniel Wibberg, Forschungszentrum Jülich |
  | DATAREX | [Recommendations for data brokering, 6 January](https://zenodo.org/records/17979335) | Ulrike Wittig, HITS |
  | ELIXIR-STEERS | [Workflow optimisation proof of concept, 19 June](https://zenodo.org/records/20759675) | Björn Grüning, University of Freiburg |

  The records establish contributions to joint outputs, not sole delivery
  by the German Node. They also record publication dates, which need not be
  the dates the work was done. A full report would need other publications,
  software, training and service activity beyond this set of records.
eval_notes: |
  Scored:
  1. Gives a substantive view across projects, with concrete 2026 outputs
     rather than a list of project memberships or future commitments.
  2. Correctly connects outputs to their projects. Verified examples include
     E-PAN completeness standards, FAIRyMAGs' Galaxy workflow, HARVEST
     RO-Crates, the non-human pathogen gap analysis, DATAREX brokering
     guidance, the Tools Platform report and STEERS M3.5.
  3. Establishes the German contribution with people, institutions or other
     direct evidence; does not attribute all consortium work solely to the
     German Node or count EMBL Heidelberg automatically as ELIXIR Germany.
  4. Uses the 2026 period consistently and distinguishes publication from
     delivery/activity dates where that affects the interpretation.
  5. Describes the coverage honestly rather than presenting a selected
     public record set as Germany's complete annual output.
  Accepted: other evidenced outputs, publications, software, training or
  service activity linked to its projects. General Node news or routine
  services alone do not answer the project-output question.
  A useful representative overview can pass without
  matching every example or an exact count. Neither Zenodo nor a German
  author-affiliation filter is part of the user's question. Do not require
  29 records, funding figures, a missing-output inventory, specific German
  authors, or the former mandatory WP7 example. The Tools Platform record
  was published in 2026 but reports a 2025 meeting. E-PAN output publication
  after its listed end date is not itself an error.
  Training Platform D4.4 (Zenodo 20098046), published 30 March 2026,
  explicitly lists ELIXIR-DE as a responsible participant and credits
  Lisanna Paladin under Node DE / EMBL-HD on its first page. Accept that
  source-attributed contribution; EMBL affiliation alone still does not
  establish German Node involvement.
