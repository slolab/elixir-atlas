id: atlas_261111-005
use_case: A5
question: |
  Who has leadership or liaison roles in more than two ELIXIR groups?
answerability: answerable
reference_answer: |
  These people hold leadership or liaison roles in more than two ELIXIR groups. Here are three documented examples for each:

  | Person | Examples of group roles |
  | --- | --- |
  | **Katharina Heil** | [RDM Community liaison](https://elixir-europe.org/communities/research-data-management), [Training Platform Coordinator](https://elixir-europe.org/platforms/training), and Hub role in the [Communities Future Focus Group](https://elixir-europe.org/focus-groups/communities-future). |
  | **Physilia Chua** | Hub representative in the [Biodiversity Community](https://elixir-europe.org/communities/biodiversity), [Interoperability Platform liaison](https://elixir-europe.org/platforms/interoperability), and Hub role in the [Pathogen Data Focus Group](https://elixir-europe.org/focus-groups/pathogen-data). |
  | **Mihail Anton** | Liaison for the [Galaxy Community](https://elixir-europe.org/communities/galaxy), [Systems Biology Community](https://elixir-europe.org/communities/systems-biology) and [Tools Platform](https://elixir-europe.org/platforms/tools). |
  | **David Lloyd** | Hub liaison for [AI Ecosystem](https://elixir-europe.org/focus-groups/ai-ecosystem), [Credit, Recognition and Usage](https://elixir-europe.org/focus-groups/credit-recognition-usage), and [Equity, Diversity and Inclusion](https://elixir-europe.org/focus-groups/equity-diversity-and-inclusion). |
  | **Thanasis Vergoulis** | WP5 lead in [Compute](https://elixir-europe.org/platforms/compute), WP3 lead in [Data](https://elixir-europe.org/platforms/data), and co-lead of [Credit, Recognition and Usage](https://elixir-europe.org/focus-groups/credit-recognition-usage). |
eval_notes: |
  Intent: identify people whose leadership or liaison responsibilities span groups. Count each group once, even when the person has several roles within it. The reference uses Communities, Platforms and Focus Groups; other clearly identified ELIXIR group types are acceptable.

  Scored:
  1. Identifies Katharina Heil with supported roles in more than two groups.
  2. Identifies Physilia Chua with supported roles in more than two groups.
  3. Identifies Mihail Anton and David Lloyd, with supported roles in more than two groups for each.
  4. Identifies Thanasis Vergoulis with the Compute, Data and Credit, Recognition and Usage roles.
  5. Does not turn ordinary membership, repeated roles within one group or obsolete group names into extra current leadership roles.

  Accepted: shorter group lists that establish the threshold for each person. Exact totals are not required. Other people qualify if the answer supports more than two relevant roles and states what group types it counts. If explicitly limiting the answer to Community co-leads, assess the supported result for that narrower interpretation rather than requiring Hub liaisons.

  Evidence notes: the Data Platform page explicitly includes “SE-UU - Mihail Anton 1.5” among WP3 leads, in addition to his four liaison roles elsewhere. Do not demand the old total of four. Antonio and Juan Antonio are not Mihail Anton. Former Focus Groups that became Communities should not be counted twice. Additional Community support is not automatically a leadership role.
