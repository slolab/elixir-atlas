id: atlas_261111-005
use_case: "A5"
question: |
  Who holds leadership or Hub-liaison roles in more than two of ELIXIR's
  current Communities, Platforms and Focus Groups?
answerability: answerable
reference_answer: |
  Five people hold leadership or Hub-liaison roles in more than two of the
  19 current Communities, 5 Platforms and 6 current Focus Groups. Four are
  ELIXIR Hub staff.

  - **Katharina F Heil** (Hub), 10 groups: liaison for the 3D-BioInfo,
    Intrinsically Disordered Proteins, Metabolomics, Microbial
    Biotechnology, Proteomics, Research Data Management, Single-Cell Omics
    and Toxicology Communities; Training Platform Coordinator; Communities
    Future Focus Group.
  - **Physilia Ying Shi Chua** (Hub), 7 groups: liaison for the
    Biodiversity, Domestic Animals Genome and Phenome, Food and Nutrition,
    Microbiome and Plant Sciences Communities; Interoperability Platform
    liaison; Pathogen Data Focus Group.
  - **Mihail Anton** (Hub), 4 groups: liaison for the Galaxy and Systems
    Biology Communities and for the Tools and Training Platforms.
  - **David Lloyd** (Hub), 4 groups: liaison for the AI Ecosystem; Credit,
    Recognition and Usage; Equity, Diversity and Inclusion; and RNA Data
    Focus Groups.
  - **Thanasis Vergoulis** (Athena Research Center, Greece), 3 groups:
    Compute Platform WP5 lead, Data Platform WP3 lead, and co-lead of the
    Credit, Recognition and Usage Focus Group.

  Two groups each: Hub staff Daniel Barrowdale (Cancer Data, Human Copy
  Number Variation), Magda Chegkazi (Federated Human Data, Rare Diseases),
  Jonathan Tedds (Compute and Tools Platform Coordinator) and Fabio
  Liberante (Data and Interoperability Platform Coordinator); and Silvio
  Tosatto, Fotis Psomopoulos, Hervé Ménager, Vitor Martins dos Santos, Wim
  Vranken, Nicola Soranzo and Wolmar Nyberg Åkerström.

  Sources:
  - Communities: https://elixir-europe.org/communities and each Community
    page linked from it
  - Platforms: https://elixir-europe.org/platforms/compute,
    https://elixir-europe.org/platforms/data,
    https://elixir-europe.org/platforms/interoperability,
    https://elixir-europe.org/platforms/tools,
    https://elixir-europe.org/platforms/training
  - Focus Groups: https://elixir-europe.org/focus-groups,
    https://elixir-europe.org/focus-groups/ai-ecosystem,
    https://elixir-europe.org/focus-groups/communities-future,
    https://elixir-europe.org/focus-groups/credit-recognition-usage,
    https://elixir-europe.org/focus-groups/equity-diversity-and-inclusion,
    https://elixir-europe.org/focus-groups/pathogen-data,
    https://elixir-europe.org/focus-groups/rna-data
eval_notes: |
  Scored:
  1. Katharina Heil and Physilia Chua: Hub staff with roles in about 10 and
     7 groups. Group lists may be incomplete but not wrong.
  2. Mihail Anton and David Lloyd: four groups each, with the groups.
  3. Thanasis Vergoulis: three groups, Compute Platform (WP5 lead), Data
     Platform (WP3 lead) and the Credit, Recognition and Usage Focus Group.
  4. No one else is listed above two groups from these pages alone.
  Scope: current groups on /communities, /platforms and /focus-groups.
  Community co-leads and liaisons, Platform leads, coordinators, liaisons
  and work-package leads, and Focus Group leads and liaisons count.
  "Additional Community support" and the RDM Trainer Network do not. A
  Platform lead who also leads WPs of that Platform counts once.
  Accepted: "Katharina Heil", "Physilia Chua"; Hub counts off by one;
  Mihail Anton at five if the Data Platform WP3 entry "SE-UU - Mihail Anton
  1.5" is counted. Tosatto, Psomopoulos (Cellular and molecular research)
  or Chegkazi (Human data and translational research) over the threshold if
  the answer names their Science tier role and marks it as outside the
  three group types.
  Traps: past Focus Groups (Biocuration, Biodiversity, Cancer Data, Domestic
  Animals, Environmental Impact, EOSC, Learning Paths, Machine Learning,
  Professionalising Careers, Health Data, Registries, Systems Biology) and
  the former Marine Metagenomics Community. Old Focus Group URLs for
  Systems Biology and Biodiversity redirect to the Community pages; each
  counts once. "Antonio" and "Juan Antonio" are not Mihail Anton.
