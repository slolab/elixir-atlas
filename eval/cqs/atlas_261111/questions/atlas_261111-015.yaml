id: atlas_261111-015
use_case: "C1.1"
question: |
  What should I use for genome-scale metabolic modelling?
answerability: answerable
reference_answer: |
  A useful starting set is a modelling tool, a model repository and a way
  to test and share your results. The choice depends on whether you are
  building a model or analysing an existing one.

  - **Build or analyse models:** [CarveMe](https://bio.tools/carveme) automates
    reconstruction, [merlin](https://bio.tools/merlin-sysbio) provides a graphical
    reconstruction workflow, and the [COBRA Toolbox](https://bio.tools/COBRA_Toolbox)
    supports constraint-based analysis.
  - **Find and compare models:** [Metabolic Atlas](https://bio.tools/metabolicatlas)
    provides open genome-scale models for browsing and analysis;
    [MetaNetX](https://bio.tools/metanetx) helps reconcile metabolite and
    reaction identifiers. Both are discussed in the [Systems Biology white paper](https://f1000research.com/articles/11-1265/v2).
  - **Check and share the work:** use [MEMOTE](https://bio.tools/memote) for
    model tests and [standard-GEM](https://www.biorxiv.org/content/10.1101/2023.03.21.512712v1.abstract)
    to organise a versioned model repository. The [Making Models That Matter preprint](https://arxiv.org/abs/2609.13127)
    also recommends FROG analysis for checking the reproducibility of
    genome-scale models, open formats such as SBML, clear annotations and
    shared simulation settings.

  If you already have a model, start by checking its format and the analysis
  you need before choosing a reconstruction tool.
eval_notes: |
  Scored:
  1. Recommends tools or resources relevant to genome-scale metabolic
     modelling and explains their uses rather than listing unrelated
     systems biology tools. Verified options include CarveMe, merlin,
     COBRA Toolbox, Metabolic Atlas, MetaNetX, MEMOTE and standard-GEM.
  2. Makes a useful distinction between reconstruction, analysis, finding
     existing models, or testing/sharing, without prescribing an unsupported
     universal best tool.
  3. Describes the recommended resources accurately and gives supporting
     evidence. Catalogue tags and Community links are not formal endorsement.
  4. Accounts for the unspecified organism, model and task by making a
     reasonable conditional recommendation or asking a focused follow-up
     after giving useful starting options.
  Accepted: a narrower tool-focused answer, a broader workflow including
  SBML, annotations, versioning and reproducibility, or other evidenced
  choices. Do not require a fixed resource count, explicit endorsement
  labels for every item, the whole standards list, a ten-point checklist,
  or mention of uncollected sources and future RDMkit work. If the answer
  mentions FROG, the preprint recommends it for GEM reproducibility; if it
  mentions the Systems Biology bio.tools tag, SKM and GlyCombo are not a
  GEM toolset. Missing use-case details must not be invented.
