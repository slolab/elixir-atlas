id: atlas_261111
version: 1
purpose: |
  I coordinate or lead ELIXIR Communities, work for an ELIXIR Node, edit the
  ELIXIR website, or am a researcher looking for what ELIXIR offers in my
  field. I want an Atlas over ELIXIR's public information, from the ELIXIR and
  Node websites, the Scientific Programme, project plans on Zenodo,
  publications, tool and training catalogues and EU project records, that I
  can ask in plain language.

  As Communities Coordinator, I use it to see where Communities overlap, which
  are inactive, how to reach each one and which practices others could reuse.
  As a Node, I use it to find what my Node committed to in each project, who
  delivers it, whether it is funded or in-kind, and what the Node delivered
  across its portfolio. As Content Editor, I use it to draft and update
  project webpages. As a researcher or Community co-lead, I use it to find the
  tools, standards, training and Communities in a field and to plan a
  Community's next steps.
reference_dataset: 20261111T134918Z
context: |
  Answers rely on public information only. The Perun people export, Slack,
  meeting minutes and documents that need permission are out of scope; where a
  question needs them, say what is missing instead of guessing. An
  organisation's EU funding does not establish that a named person was
  funded. Give the source of each key fact.
rubric:
  - name: correctness
    criteria: |
      Grade the answer against the question, the context, the reference answer
      and the eval notes. Each component in the eval notes scores 1 when the
      answer states it correctly and 0 otherwise. Accept equivalent wording,
      names and formats. Extra content does not change the score unless it
      contradicts a component. Missing information stated as fact scores 0.

      Verdict:
      - correct: every component scores 1.
      - partial: at least half score 1.
      - failed: fewer than half score 1, or there is no answer.
