id: atlas_261111
version: 2
purpose: |
  I coordinate or lead ELIXIR Communities, work for an ELIXIR Node, edit the
  ELIXIR website, or am a researcher looking for what ELIXIR offers in my
  field. I want an Atlas over ELIXIR's public information, from the ELIXIR and
  Node websites, the Scientific Programme, project plans on Zenodo,
  publications, tool and training catalogues and EU project records, that I
  can ask in plain language.

  As Communities Coordinator, I use it to see where Communities overlap, which
  are inactive, how to reach each one and which practices others could reuse.
  As a Node, I use it to find what my Node committed to in each project, who
  delivers it, whether it is funded or in-kind, and what the Node delivered
  across its portfolio. As Content Editor, I use it to draft and update
  project webpages. As a researcher or Community co-lead, I use it to find the
  tools, standards, training and Communities in a field and to plan a
  Community's next steps.
reference_dataset: 20261111T204305Z
context: |
  Answer as of 11 November 2026 using the supplied public-source snapshot
  about ELIXIR. Private member records, Slack conversations and restricted
  documents are not available.
rubric:
  - name: correctness
    criteria: |
      Grade the factual answer to the question as asked. Use the reference
      answer and the Scored components in the eval notes as evidence anchors,
      not a required script or an exhaustive list of acceptable answers.
      Each component scores 1 when addressed correctly and 0 otherwise.
      Exclude a conditional component when its condition does not apply;
      omitting an optional topic does not earn a factual point.
      Apply the alternatives in the eval notes. Accept equivalent names,
      supported examples and reasonable interpretations of informal wording.
      Do not require an unstated purpose, research method, optional detail or
      the reference answer's exact selection of examples. If an interpretation
      changes which components apply, assess the equivalent factual needs of
      that interpretation; it must still address the question's main request.

      Distinguish evidence from inference. Unsupported certainty, invented
      facts and claims that missing evidence proves absence are errors.
      Judge qualified claims as written. Reporting that a search did not
      find a particular kind of resource does not by itself assert that no
      related evidence exists. Missing required answer content still loses
      coverage; a search limitation does not replace an answer.
      Material false claims in extra content also count against correctness.
      Assess writing and presentation separately under usefulness.

      Verdict:
      - correct: every applicable component scores 1 and there are no
        material factual errors.
      - partial: at least half of the applicable components score 1, but
        some required information is missing or materially wrong.
      - failed: fewer than half score 1, the main conclusion is materially
        false, or there is no substantive answer.
  - name: usefulness
    criteria: |
      Assess how well the answer serves a reasonable reading of the question.
      Intent may be implicit. Do not demand a purpose or output format that
      the question never specified. Score each of these four qualities 1
      when met and 0 otherwise:
      1. The opening promptly gives the main answer, practical action or
         necessary limitation. A brief relevant clarification of the entity
         or scope is acceptable; research process or extended background
         must not delay the answer.
      2. The detail is sufficient and proportionate to the request. Secondary
         facts and caveats do not bury the result; brevity alone is not enough.
      3. The language and structure are clear and easy to use. The answer
         avoids distracting totals, classification rules and repeated caveats.
      4. Useful resource and evidence links sit beside the relevant names or
         claims. A shared link for a paragraph, list item or table row is fine;
         a detached list of URLs alone is not.

      Judge these qualities separately from factual correctness. A clear
      explanation of an evidence limit can be useful. Do not require the
      reference answer's length, headings, layout or wording.

      Verdict:
      - correct: all four qualities are met.
      - partial: two or three qualities are met.
      - failed: fewer than two qualities are met, or there is no answer.
