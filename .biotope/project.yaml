purpose: 'The ELIXIR Atlas is an internal database of who does what in ELIXIR, built
  from ELIXIR and Node websites, the Scientific Programme and work plans, EU project
  records (CORDIS, Zenodo), F1000 and Europe PMC publications, bio.tools, TeSS and
  the Perun people export. Users are ELIXIR group co-leads and Hub community support
  officers, Node staff reporting on contributions, and Hub Digital Content Editors.
  They use it to: (4) see where Communities, Platforms, Focus Groups, working groups
  and task forces overlap in topics, people, events and outputs, who holds roles in
  more than two places and how much time that takes, where groups plan similar events
  or outputs this year, and which groups would benefit from a joint activity; (6)
  get a consolidated picture of one Community: the tools, training and resources it
  supports, its people, projects, outputs and plans, its overlap with other Communities
  and Platforms, repetition over time, and gaps against the state of the art in its
  field; (7) find which people of a Node took part in a project, what they did, and
  whether their work was funded or in-kind; (8) gather and check the facts for a project
  page (aims, outcomes, lead, Nodes, links to Communities and Platforms, dates, work
  packages, deliverables, outputs), with the source and date of each detail, and find
  changes, gaps and conflicts between sources. Story 5 (induction for people new to
  a role) is served only by group contacts and people''s roles. Every fact keeps the
  URL and retrieval date of its source; conflicting values and unclear entity matches
  stay visible and are listed for manual resolution.'
